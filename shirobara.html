function srCardHtml(card, faceUp){
  if(!card) return '';
  if(card.type === 'back'){
    return `<div class="mini-card back" style="width:40px; height:60px; padding:4px;"><div class="icon" style="font-size:1rem;">?</div></div>`;
  }
  const role = SR_ROLES[card.type];
  if(card.type === 'ghost'){
    return `<div class="mini-card ghost" style="width:40px; height:60px; padding:4px;"><div class="icon" style="font-size:1rem;">👻</div><div class="name" style="font-size:0.6rem;">幽魂</div></div>`;
  }
  if(!role) return '';
  return `<div class="mini-card team-${role.team}" style="width:40px; height:60px; padding:4px;">
    ${role.bud?'<span class="bud" style="font-size:0.6rem;">🌱</span>':''}
    <div class="icon" style="font-size:1rem;">${role.icon}</div>
    <div class="name" style="font-size:0.6rem;">${role.name}</div>
  </div>`;
}

function srRenderHand(){
  const hand = g('game-my-hand');
  hand.innerHTML = '<div class="label">👤 あなたの手札</div>';
  const row = mk('div', 'hand-row');
  if(!srMyCards || srMyCards.length===0){
    row.innerHTML = '<div style="color:var(--muted); font-size:0.78rem;">手札なし</div>';
  } else {
    srMyCards.forEach(card=>{
      const role = SR_ROLES[card.type];
      const isGhost = card.type === 'ghost';
      const cardEl = mk('div', 'mini-card ' + (isGhost?'ghost':'team-'+role.team));
      cardEl.dataset.cardId = card.id;
      if(isGhost){
        cardEl.innerHTML = `<div class="icon">👻</div><div class="name">幽魂</div>`;
      } else {
        cardEl.innerHTML = `${role.bud?'<span class="bud">🌱</span>':''}<div class="icon">${role.icon}</div><div class="name">${role.name}</div>`;
      }
      // Click handler: only if it's my turn in phase2
      if(srGs.phase==='phase2' && srGs.turnPlayerId===myId){
        cardEl.onclick = ()=>srSelectCardForPlay(card.id);
        cardEl.style.cursor = 'pointer';
      }
      row.appendChild(cardEl);
    });
  }
  hand.appendChild(row);
}

function srSelectCardForPlay(cardId){
  // Highlight selected then confirm
  document.querySelectorAll('#game-my-hand .mini-card').forEach(c=>c.classList.toggle('selected', c.dataset.cardId===cardId));
  // Confirm via modal
  srShowConfirmModal('カードを出す', `このカードを裏向きで場に出します。よろしいですか？`, ()=>{
    srSubmitPlayCard(cardId);
  });
}

function srRenderActionArea(){
  const area = g('game-action-area');
  area.innerHTML = '';
  // Active magic info
  if(srGs.activeMagic){
    const m = SR_MAGIC[srGs.activeMagic-1];
    const card = mk('div', 'magic-card');
    card.innerHTML = `<div class="num">魔法効果 ${m.n}</div><div class="name">${m.name}</div><div class="desc">${m.desc}</div>`;
    area.appendChild(card);
  }
  // Phase 1: coin holder picks target
  if(srGs.phase === 'phase1' && srGs.coinHolderId === myId){
    const candidates = srGs.players.filter(p=>p.id!==myId && p.hasChip);
    const wrapper = mk('div', 'panel');
    wrapper.innerHTML = `<div style="color:var(--gold); font-size:0.85rem; margin-bottom:8px;">🪙 コインを渡す相手を選んでください（水晶チップ保持者のみ）</div>`;
    if(candidates.length===0){
      wrapper.innerHTML += `<div style="color:var(--muted);">対象がいません</div>`;
    } else {
      const grid = mk('div'); grid.style.cssText = 'display:flex; flex-direction:column; gap:6px;';
      candidates.forEach(p=>{
        const btn = mk('button', 'btn btn-rose');
        btn.style.padding = '8px 12px';
        btn.textContent = p.name;
        btn.onclick = ()=>srSubmitCoinPass(p.id);
        grid.appendChild(btn);
      });
      wrapper.appendChild(grid);
    }
    area.appendChild(wrapper);
  }
  // Target picker for magic effects
  if(srGs.targetPickerId === myId && srGs.targetPickerMagic){
    const m = SR_MAGIC[srGs.targetPickerMagic-1];
    const wrapper = mk('div', 'panel');
    wrapper.innerHTML = `<div style="color:var(--gold); font-size:0.85rem; margin-bottom:8px;">🎯 効果${m.n}: ${m.name}</div>`;
    if(srGs.targetPickerMagic===6){
      // Special: choose first or last
      wrapper.innerHTML += `<div style="color:var(--muted); font-size:0.78rem; margin-bottom:8px;">自分の手番をどうしますか？</div>`;
      const grid = mk('div'); grid.style.cssText = 'display:flex; gap:6px;';
      const btn1 = mk('button', 'btn btn-rose'); btn1.textContent = '通常（最初）';
      btn1.onclick = ()=>srSubmitMagicTarget(['FIRST']);
      const btn2 = mk('button', 'btn btn-blood'); btn2.textContent = '最後にする';
      btn2.onclick = ()=>srSubmitMagicTarget(['LAST']);
      grid.appendChild(btn1); grid.appendChild(btn2);
      wrapper.appendChild(grid);
    } else if(srGs.targetPickerMagic === 10){
      // 効果10: 対象を指定するか/しないかを選ぶ
      wrapper.innerHTML += `<div style="color:var(--muted); font-size:0.78rem; margin-bottom:8px;">公開前に1人を指定してカードを差し替えさせるか、スキップを選んでください（任意効果）</div>`;
      const candidateIds = srGs.targetCandidateIds || [];
      const candidates = candidateIds.map(id=>srGs.players.find(p=>p.id===id)).filter(p=>p);
      const grid = mk('div'); grid.style.cssText = 'display:flex; flex-direction:column; gap:6px;';
      candidates.forEach(p=>{
        const btn = mk('button', 'btn');
        btn.style.padding = '8px 12px';
        btn.textContent = `🎯 ${p.name} に差し替えさせる`;
        btn.onclick = ()=>srSubmitMagic10Pick(p.id);
        grid.appendChild(btn);
      });
      const skipBtn = mk('button', 'btn btn-ghost'); skipBtn.textContent = 'スキップ（指定しない）';
      skipBtn.onclick = ()=>srSubmitMagic10Pick(null);
      grid.appendChild(skipBtn);
      wrapper.appendChild(grid);
    } else {
      // Select N players from candidates
      const cnt = srGs.targetPickerCount || 1;
      const candidateIds = srGs.targetCandidateIds || [];
      const candidates = candidateIds.map(id=>srGs.players.find(p=>p.id===id)).filter(p=>p);
      wrapper.innerHTML += `<div style="color:var(--muted); font-size:0.78rem; margin-bottom:8px;">${cnt}人を選択</div>`;
      const grid = mk('div'); grid.style.cssText = 'display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto;';
      let selected = [];
      candidates.forEach(p=>{
        const btn = mk('button', 'btn');
        btn.style.padding = '8px 12px';
        btn.textContent = `${p.name} (手札${p.handCount}枚)`;
        btn.onclick = ()=>{
          if(cnt===1){
            srSubmitMagicTarget([p.id]);
          } else {
            if(selected.includes(p.id)){
              selected = selected.filter(x=>x!==p.id);
              btn.classList.remove('btn-gold');
            } else {
              selected.push(p.id);
              btn.classList.add('btn-gold');
              if(selected.length>=cnt){
                setTimeout(()=>srSubmitMagicTarget(selected), 300);
              }
            }
          }
        };
        grid.appendChild(btn);
      });
      wrapper.appendChild(grid);
    }
    area.appendChild(wrapper);
  }
  // Magic 10 swap selection - 対象本人が差し替えるカードを選ぶ
  if(srGs.swapPending && srGs.swapPending.targetId === myId){
    const wrapper = mk('div', 'panel');
    wrapper.innerHTML = `<div style="color:var(--gold); font-size:0.85rem; margin-bottom:8px;">🔄 効果10: あなたは指定されました。出すカードを別のものに差し替えてください。</div>`;
    wrapper.innerHTML += `<div style="font-size:0.78rem; color:var(--muted); margin-bottom:8px;">手札のカードをタップすると、それが新しく場に出るカードになります（元のカードは手札に戻ります）。</div>`;
    const handArea = mk('div'); handArea.style.cssText = 'display:flex; gap:6px; flex-wrap:wrap;';
    srMyCards.forEach(card=>{
      const role = SR_ROLES[card.type];
      const isGhost = card.type === 'ghost';
      const cardEl = mk('div', 'mini-card ' + (isGhost?'ghost':'team-'+role.team));
      if(isGhost){
        cardEl.innerHTML = `<div class="icon">👻</div><div class="name">幽魂</div>`;
      } else {
        cardEl.innerHTML = `${role.bud?'<span class="bud">🌱</span>':''}<div class="icon">${role.icon}</div><div class="name">${role.name}</div>`;
      }
      cardEl.style.cursor = 'pointer';
      cardEl.onclick = ()=>{
        if(isHost) srHostPickReplace(myId, card.id);
        else fbSendToHost({type:'sr_action_pick_replace_card', cardId: card.id});
      };
      handArea.appendChild(cardEl);
    });
    wrapper.appendChild(handArea);
    area.appendChild(wrapper);
  }
  // Phase 2: my turn
  if(srGs.phase === 'phase2' && srGs.turnPlayerId === myId){
    const wrapper = mk('div', 'panel');
    const forced = srGs.forcedPlayers.includes(myId);
    const isRandom = srGs.randomPlayers.includes(myId);
    if(isRandom){
      wrapper.innerHTML = `<div style="color:var(--amber);">🎲 あなたはランダムに1枚出します（自動処理中）</div>`;
    } else if(forced){
      wrapper.innerHTML = `<div style="color:var(--amber);">⚡ あなたは必ずカードを出す必要があります。上の手札からカードをタップしてください。</div>`;
    } else {
      wrapper.innerHTML = `<div style="color:var(--gold);">▶ あなたの手番です。手札をタップして出すか、パスしてください。</div>`;
      const passBtn = mk('button', 'btn btn-ghost');
      passBtn.style.marginTop = '8px';
      passBtn.textContent = '⏭ パス';
      passBtn.onclick = ()=>srSubmitPass();
      wrapper.appendChild(passBtn);
    }
    area.appendChild(wrapper);
  }
  // Phase 3: revealed cards
  if(srGs.phase === 'phase3' && srGs.revealedCards){
    const wrapper = mk('div', 'panel');
    const wasNoShuffle = srGs.lastMagic === 2;
    wrapper.innerHTML = `<div style="color:var(--gold); margin-bottom:8px;">📜 公開されたカード (${srGs.revealedCards.length}枚)${wasNoShuffle?' <span style="color:var(--green); font-size:0.78rem;">📜 効果2: シャッフルなし</span>':''}</div>`;
    if(wasNoShuffle){
      // 誰が何を出したか3列グリッドで表示（多人数でもコンパクトに）
      const list = mk('div');
      list.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:6px;';
      srGs.revealedCards.forEach(c=>{
        const p = srGs.players.find(pp=>pp.id===c.playerId);
        const playerName = p ? p.name : '?';
        const isMe = c.playerId === myId;
        const role = c.type ? SR_ROLES[c.type] : null;
        const isGhost = c.type === 'ghost';
        const cardLabel = isGhost ? '👻幽魂' : (role ? `${role.icon}${role.name}` : '?');
        const teamColor = isGhost ? 'var(--muted)' : (role?.team === 'rose' ? 'var(--rose)' : 'var(--blood-bright)');
        const item = mk('div');
        item.style.cssText = `display:flex; flex-direction:column; gap:2px; padding:6px 8px;
          background:${isMe?'rgba(232,220,196,0.12)':'var(--surface2)'};
          border:1px solid ${isMe?'var(--rose-dark)':'var(--surface3)'};
          border-radius:6px;`;
        item.innerHTML = `
          <div style="font-size:0.72rem; color:${isMe?'var(--rose)':'var(--muted)'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${isMe?'👤 ':''}${playerName}</div>
          <div style="font-size:0.88rem; font-weight:700; color:${teamColor};">${cardLabel}</div>
        `;
        list.appendChild(item);
      });
      wrapper.appendChild(list);
    } else {
      // 通常: シャッフル済みなので順不同（横並び）
      const row = mk('div', 'hand-row');
      srGs.revealedCards.forEach(c=>{
        row.innerHTML += srCardHtml(c, true);
      });
      wrapper.appendChild(row);
    }
    area.appendChild(wrapper);
  }
  // Waiting for others
  if(srGs.phase === 'phase1' && srGs.coinHolderId !== myId && !srGs.activeMagic){
    const coin = srGs.players.find(p=>p.id===srGs.coinHolderId);
    const wrapper = mk('div', 'panel');
    wrapper.innerHTML = `<div style="color:var(--muted); text-align:center;">🪙 ${coin?.name} がコインを渡す相手を選んでいます...</div>`;
    area.appendChild(wrapper);
  }
  if(srGs.phase === 'phase2' && srGs.turnPlayerId !== myId){
    const turn = srGs.players.find(p=>p.id===srGs.turnPlayerId);
    const wrapper = mk('div', 'panel');
    wrapper.innerHTML = `<div style="color:var(--muted); text-align:center;">▶ ${turn?.name} の手番です...</div>`;
    area.appendChild(wrapper);
  }
}

// ============================================================
// MAGIC EFFECT TESTS (デバッグ用)
// ブラウザのコンソールで srTestMagic() を実行すると、12種の魔法効果のロジックを
// シミュレーションして、各効果が想定通り動くか確認できます。
// ============================================================
function srTestMagic(){
  const results = [];
  // モックstateを作る関数
  const mockState = (n=5) => {
    const players = Array.from({length:n}, (_,i)=>({
      id:'p'+i, name:'P'+i, role:i===0?'whiteRose':i===1?'bishop':i===2?'darkKnife':'believer',
      hand:[{id:'h'+i+'a',type:'believer'},{id:'h'+i+'b',type:'ghost'}],
      chip:i+1, isCpu:i!==0
    }));
    return {
      players, phase:'phase1', coinIdx:0, log:[],
      chipsPlaced:[], forcedPlayers:[], randomPlayers:[], syncedPairs:[],
      board:{whiteRose:null, sacrifice:[], dead:[], bloodBlade:[], ghostSide:[{id:'g1',type:'ghost'}]},
      playedCards:[], pendingActions:[],
      winBudRose:2, winBudBlood:2,
    };
  };
  // テスト関数
  const test = (name, fn) => {
    try {
      const result = fn();
      results.push({name, pass: !!result, msg: typeof result === 'string' ? result : (result ? 'OK' : 'FAIL')});
    } catch(e){
      results.push({name, pass:false, msg:'ERR: '+e.message});
    }
  };

  // 1番: 指定1人は必ず出す
  test('効果1: 候補が正しく絞られる（手札持ち他プレイヤーのみ）', ()=>{
    const f = mockState(5);
    f.players[3].hand = []; // P3は手札なし
    // 候補抽出のロジックを直接シミュレート
    const others = f.players.filter(p=>p.id !== 'p0');
    const candidates = others.filter(p=>(p.hand||[]).length > 0);
    return candidates.length === 3; // P1,P2,P4
  });

  // 2番: シャッフルなしで公開
  test('効果2: noShuffleAtReveal フラグが立つ', ()=>{
    const f = mockState();
    f.noShuffleAtReveal = true;
    return f.noShuffleAtReveal === true;
  });

  // 3番: 右隣ランダム
  test('効果3: 右隣が特定される', ()=>{
    const f = mockState(5);
    const holderIdx = 2;
    const rightIdx = (holderIdx - 1 + 5) % 5;
    return rightIdx === 1; // holderIdx=2 の右隣=1
  });

  // 4番: 左隣ランダム
  test('効果4: 左隣が特定される', ()=>{
    const f = mockState(5);
    const holderIdx = 2;
    const leftIdx = (holderIdx + 1) % 5;
    return leftIdx === 3; // holderIdx=2 の左隣=3
  });

  // 5番: 2人同期（手番順並べ替え）
  test('効果5: 手番順でA/B並べ替え', ()=>{
    const turnOrder = ['p0','p1','p2','p3','p4'];
    const pair = ['p3','p1']; // 後手番,先手番
    const idx0 = turnOrder.indexOf(pair[0]);
    const idx1 = turnOrder.indexOf(pair[1]);
    const reordered = idx1 < idx0 ? [pair[1], pair[0]] : pair;
    return reordered[0] === 'p1' && reordered[1] === 'p3';
  });

  // 6番: 自分の手番を最後に
  test('効果6: turnOrderの最後にholderを移動', ()=>{
    const players = ['p0','p1','p2','p3','p4'];
    const holderIdx = 2; // p2
    const n = 5;
    const order = [];
    for(let i=1; i<=n; i++) order.push(players[(holderIdx+i)%n]);
    order[n-1] = 'p2';
    return order[n-1] === 'p2';
  });

  // 7番: 幽魂を1枚得る
  test('効果7: ボード横に幽魂があれば対象者に渡る', ()=>{
    const f = mockState(5);
    const target = f.players[1];
    const before = target.hand.length;
    if(f.board.ghostSide.length === 0) return 'ボード横の幽魂なし（事前条件NG）';
    const ghost = f.board.ghostSide.shift();
    target.hand.push(ghost);
    return target.hand.length === before + 1 && f.board.ghostSide.length === 0;
  });
  test('効果7: ボード横の幽魂が空なら不発', ()=>{
    const f = mockState(5);
    f.board.ghostSide = [];
    return f.board.ghostSide.length === 0; // 不発条件成立
  });

  // 8番: 両隣は必ず出す
  test('効果8: 両隣がforcedPlayersに入る', ()=>{
    const f = mockState(5);
    const holderIdx = 2;
    const n = 5;
    const rightIdx = (holderIdx - 1 + n) % n;
    const leftIdx = (holderIdx + 1) % n;
    f.forcedPlayers.push(f.players[rightIdx].id);
    f.forcedPlayers.push(f.players[leftIdx].id);
    return f.forcedPlayers.length === 2 && f.forcedPlayers.includes('p1') && f.forcedPlayers.includes('p3');
  });

  // 9番: 暗刃が白薔薇/司教を確認
  test('効果9: 暗刃が存在すれば白薔薇/司教IDを取得', ()=>{
    const f = mockState(5);
    const darkKnife = f.players.find(p=>p.role==='darkKnife');
    const targets = f.players.filter(p=>p.role==='whiteRose' || p.role==='bishop');
    return darkKnife && targets.length === 2;
  });
  test('効果9: 暗刃不在なら効果なし', ()=>{
    const f = mockState(5);
    f.players[2].role = 'believer'; // 暗刃を信者に
    const darkKnife = f.players.find(p=>p.role==='darkKnife');
    return !darkKnife; // 不在
  });

  // 10番: 公開前カード差し替え
  test('効果10: カードを出したプレイヤーから候補抽出', ()=>{
    const f = mockState(5);
    f.playedCards = [{playerId:'p1', type:'believer', cardId:'c1'}, {playerId:'p3', type:'ghost', cardId:'c3'}];
    const holderId = 'p0';
    const playedIds = f.playedCards.map(pc=>pc.playerId);
    const candidates = f.players.filter(p=>
      p.id !== holderId && playedIds.includes(p.id) && (p.hand||[]).length > 0
    );
    return candidates.length === 2; // p1, p3
  });
  test('効果10: カードを出していないプレイヤーは候補外', ()=>{
    const f = mockState(5);
    f.playedCards = [{playerId:'p1', type:'believer', cardId:'c1'}];
    const holderId = 'p0';
    const playedIds = f.playedCards.map(pc=>pc.playerId);
    const candidates = f.players.filter(p=>
      p.id !== holderId && playedIds.includes(p.id) && (p.hand||[]).length > 0
    );
    return candidates.length === 1 && candidates[0].id === 'p1';
  });

  // 11番: 手札を1枚見る
  test('効果11: 対象に手札があれば1枚見られる', ()=>{
    const f = mockState(5);
    const target = f.players[1];
    return target.hand.length > 0;
  });
  test('効果11: 対象に手札がなければ何も見えない', ()=>{
    const f = mockState(5);
    const target = f.players[1];
    target.hand = [];
    return target.hand.length === 0;
  });

  // 12番: 指定1人は必ず出す（1と同じ）
  test('効果12: 候補が正しく絞られる', ()=>{
    const f = mockState(5);
    const others = f.players.filter(p=>p.id !== 'p0');
    const candidates = others.filter(p=>(p.hand||[]).length > 0);
    return candidates.length === 4;
  });

  // 結果出力
  const passed = results.filter(r=>r.pass).length;
  const total = results.length;
  console.log(`%c=== 魔法効果テスト結果: ${passed}/${total} ===`, 'font-size:14px; color:'+(passed===total?'lime':'red'));
  results.forEach(r=>{
    const mark = r.pass ? '✅' : '❌';
    console.log(`${mark} ${r.name} - ${r.msg}`);
  });
  return {passed, total, results};
}
