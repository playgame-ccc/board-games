<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>血と刃の白薔薇</title>
<style>
:root {
  --bg: #0a0a0d;
  --surface: #16151a;
  --surface2: #22202a;
  --surface3: #322f3a;
  --rose: #e8dcc4;
  --rose-dark: #b8a888;
  --rose-glow: rgba(232,220,196,0.4);
  --blood: #a02030;
  --blood-bright: #d63243;
  --blood-glow: rgba(214,50,67,0.4);
  --gold: #d4af37;
  --text: #e0d8c8;
  --muted: #7a7268;
  --green: #2dff8a;
  --red: #ff2d4a;
  --amber: #ffb020;
  --mono: 'Courier New', monospace;
}
* { box-sizing: border-box; }
body {
  margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family: 'Hiragino Mincho ProN','MS PMincho', serif;
  min-height:100vh;
  -webkit-tap-highlight-color: transparent;
  overflow-x:hidden;
}
body::before {
  content:''; position:fixed; inset:0;
  background: radial-gradient(ellipse at top, rgba(160,32,48,0.08), transparent 60%),
              radial-gradient(ellipse at bottom, rgba(232,220,196,0.04), transparent 50%);
  pointer-events:none; z-index:0;
}
.screen { display:none; padding:14px; max-width:520px; margin:0 auto; position:relative; z-index:1; gap:12px; }
.screen.active { display:flex; flex-direction:column; }

h1, h2, h3 { font-family:'Hiragino Mincho ProN', serif; font-weight:400; letter-spacing:2px; }
h1 { font-size:1.8rem; text-align:center; margin:18px 0 6px; }
h2 { font-size:1.3rem; text-align:center; margin:14px 0 8px; color:var(--rose); }
h3 { font-size:1.0rem; color:var(--rose-dark); margin:8px 0; }

.title-main {
  font-size:2.2rem; text-align:center; letter-spacing:8px;
  background: linear-gradient(180deg, var(--rose), var(--rose-dark));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  text-shadow: 0 0 30px var(--rose-glow);
  margin:24px 0 4px;
}
.title-sub { text-align:center; color:var(--muted); font-size:0.78rem; letter-spacing:6px; margin-bottom:18px; }

.btn {
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 18px; border-radius:8px; border:1px solid var(--surface3);
  background:var(--surface2); color:var(--text);
  font-family:var(--mono); font-size:0.92rem; cursor:pointer;
  transition:all 0.2s;
}
.btn:active { transform:scale(0.98); }
.btn-rose { background:linear-gradient(135deg, rgba(232,220,196,0.15), rgba(184,168,136,0.05)); border-color:var(--rose-dark); color:var(--rose); }
.btn-blood { background:linear-gradient(135deg, rgba(160,32,48,0.2), rgba(214,50,67,0.05)); border-color:var(--blood); color:var(--blood-bright); }
.btn-gold { background:linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05)); border-color:var(--gold); color:var(--gold); }
.btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--surface3); }
.btn:disabled { opacity:0.4; cursor:not-allowed; }

.input {
  background:var(--surface); border:1px solid var(--surface3); border-radius:6px;
  color:var(--text); padding:12px; font-size:0.95rem; font-family:var(--mono);
  width:100%;
}
.input:focus { outline:none; border-color:var(--rose-dark); }
.code-input { font-size:1.6rem; letter-spacing:8px; text-align:center; }
.row { display:flex; gap:8px; }

.panel {
  background:rgba(22,21,26,0.85); border:1px solid var(--surface3);
  border-radius:10px; padding:14px; backdrop-filter:blur(6px);
}
.divider { height:1px; background:linear-gradient(90deg, transparent, var(--surface3), transparent); margin:6px 0; }
.code-box {
  background:linear-gradient(135deg, rgba(22,21,26,0.95), rgba(34,32,42,0.95));
  border:1px solid var(--gold); border-radius:10px; padding:14px; text-align:center;
}
.code-box .label { color:var(--muted); font-size:0.72rem; letter-spacing:3px; }
.code-box .code { font-family:var(--mono); font-size:2.2rem; color:var(--gold); letter-spacing:8px; }

.error { color:var(--red); font-size:0.85rem; min-height:1.2em; text-align:center; }
.status-txt { color:var(--muted); font-size:0.85rem; text-align:center; min-height:1.2em; }

/* === Player list === */
.player-list { display:flex; flex-direction:column; gap:6px; }
.player-item {
  display:flex; align-items:center; gap:10px;
  padding:8px 12px; background:var(--surface); border:1px solid var(--surface3); border-radius:8px;
}
.player-item.is-me { border-color:var(--rose-dark); background:rgba(232,220,196,0.06); }
.avatar {
  width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:0.9rem; background:var(--surface3); color:var(--text);
}
.avatar.host { background:linear-gradient(135deg, var(--blood), var(--blood-bright)); color:#fff; }
.p-name { font-size:0.92rem; flex:1; }
.p-sub { font-size:0.7rem; color:var(--muted); }

/* === Game tab selector === */
.count-selector { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
.count-btn {
  width:42px; height:42px; border-radius:50%; border:1px solid var(--surface3);
  background:var(--surface2); color:var(--text); font-family:var(--mono); font-size:0.95rem; cursor:pointer;
}
.count-btn.selected { background:var(--rose-dark); color:var(--bg); border-color:var(--rose); }
.count-label { text-align:center; color:var(--muted); font-size:0.82rem; margin-top:6px; }

/* === Role cards === */
.role-card {
  background:linear-gradient(160deg, var(--surface2), var(--surface));
  border:2px solid var(--surface3); border-radius:12px; padding:18px;
  text-align:center; position:relative; overflow:hidden;
}
.role-card.team-rose { border-color:var(--rose-dark); box-shadow:0 0 30px rgba(232,220,196,0.15); }
.role-card.team-blood { border-color:var(--blood); box-shadow:0 0 30px rgba(214,50,67,0.15); }
.role-card .icon { font-size:3.5rem; margin-bottom:8px; }
.role-card .name { font-size:1.4rem; letter-spacing:4px; margin-bottom:4px; }
.role-card .name-en { font-size:0.72rem; color:var(--muted); letter-spacing:3px; margin-bottom:10px; }
.role-card .team-tag {
  display:inline-block; padding:3px 10px; border-radius:4px; font-size:0.72rem; font-family:var(--mono); letter-spacing:2px;
}
.team-tag.rose { background:rgba(232,220,196,0.15); color:var(--rose); border:1px solid var(--rose-dark); }
.team-tag.blood { background:rgba(214,50,67,0.15); color:var(--blood-bright); border:1px solid var(--blood); }
.role-card .desc { color:var(--muted); font-size:0.78rem; margin-top:10px; line-height:1.6; }
.role-card .bud { position:absolute; top:8px; right:8px; font-size:0.85rem; color:var(--rose-dark); }
.role-card .eye { position:absolute; top:8px; left:8px; font-size:0.85rem; color:var(--amber); }

/* === Mini card (hand) === */
.mini-card {
  background:linear-gradient(160deg, var(--surface2), var(--surface));
  border:1px solid var(--surface3); border-radius:8px;
  width:80px; height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:8px; position:relative; cursor:pointer; transition:transform 0.2s;
  flex-shrink:0;
}
.mini-card:active { transform:scale(0.95); }
.mini-card.team-rose { border-color:var(--rose-dark); }
.mini-card.team-blood { border-color:var(--blood); }
.mini-card.ghost { border-color:var(--muted); opacity:0.85; }
.mini-card.selected { transform:translateY(-8px); box-shadow:0 4px 20px var(--rose-glow); border-color:var(--gold); }
.mini-card .icon { font-size:2rem; margin-bottom:6px; }
.mini-card .name { font-size:0.72rem; letter-spacing:1px; }
.mini-card .bud { position:absolute; top:4px; right:4px; font-size:0.7rem; color:var(--rose-dark); }
.mini-card.back {
  background:repeating-linear-gradient(45deg, var(--surface2), var(--surface2) 4px, var(--surface3) 4px, var(--surface3) 8px);
  border-color:var(--surface3);
}
.mini-card.back .icon, .mini-card.back .name { color:var(--surface3); }

/* === Board === */
.board {
  background:linear-gradient(180deg, rgba(22,21,26,0.95), rgba(10,10,13,0.95));
  border:1px solid var(--surface3); border-radius:12px; padding:14px;
  display:flex; flex-direction:column; gap:12px;
}
.board-top { display:flex; gap:8px; justify-content:space-between; }
.board-slot {
  flex:1; min-height:130px; background:rgba(34,32,42,0.5); border:1px dashed var(--surface3);
  border-radius:8px; padding:8px; display:flex; flex-direction:column; align-items:center; gap:4px;
}
.board-slot .label { font-size:0.7rem; color:var(--muted); letter-spacing:2px; }
.board-slot .cards { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; }
.board-slot.rose { border-color:var(--rose-dark); background:rgba(232,220,196,0.05); }
.board-slot.blood { border-color:var(--blood); background:rgba(214,50,67,0.05); }
.board-slot.sacrifice { border-color:var(--rose-dark); }
.board-slot.death { border-color:var(--blood); }
.board-slot.ghost-side { flex:0 0 auto; min-width:80px; }

/* === Crystal chips === */
.chip-row { display:flex; gap:6px; align-items:center; justify-content:center; }
.chip-slot {
  width:40px; height:40px; border-radius:50%; border:2px dashed var(--surface3);
  display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:0.85rem; color:var(--muted);
}
.chip-slot.filled {
  background:linear-gradient(135deg, var(--rose), var(--rose-dark));
  color:var(--bg); border-style:solid; border-color:var(--gold);
  font-weight:700; box-shadow:0 0 12px var(--rose-glow);
}
.my-chip {
  display:inline-flex; align-items:center; justify-content:center;
  width:50px; height:50px; border-radius:50%; background:linear-gradient(135deg, var(--rose), var(--rose-dark));
  color:var(--bg); font-family:var(--mono); font-size:1.1rem; font-weight:700;
  border:2px solid var(--gold); box-shadow:0 0 16px var(--rose-glow);
}

/* === Phase bar === */
.phase-bar {
  background:var(--surface); border:1px solid var(--surface3); border-radius:8px;
  padding:8px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  font-family:var(--mono); font-size:0.78rem;
}
.phase-tag {
  padding:2px 8px; border-radius:4px; background:var(--surface3); color:var(--text);
  font-size:0.72rem; letter-spacing:1px;
}
.phase-tag.active { background:var(--gold); color:var(--bg); }

/* === Modal === */
.modal-bg {
  position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none;
  align-items:center; justify-content:center; z-index:100; padding:14px;
}
.modal-bg.active { display:flex; }
.modal {
  background:var(--surface); border:1px solid var(--gold); border-radius:12px;
  padding:18px; max-width:440px; width:100%; max-height:90vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:10px;
}
.modal h3 { margin:0; color:var(--gold); }

/* === Magic effect display === */
.magic-card {
  background:linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
  border:1px solid var(--gold); border-radius:10px; padding:12px;
}
.magic-card .num { font-family:var(--mono); font-size:1.4rem; color:var(--gold); }
.magic-card .name { font-weight:700; margin:4px 0; }
.magic-card .desc { color:var(--muted); font-size:0.82rem; line-height:1.5; }

/* === Hand area === */
.hand-area {
  background:rgba(22,21,26,0.85); border:1px solid var(--rose-dark); border-radius:10px;
  padding:10px;
}
.hand-area .label { font-size:0.72rem; color:var(--rose-dark); letter-spacing:2px; margin-bottom:6px; }
.hand-row { display:flex; gap:6px; overflow-x:auto; padding:4px 0; }

/* === Log === */
.log {
  background:var(--surface); border:1px solid var(--surface3); border-radius:8px;
  padding:8px; max-height:140px; overflow-y:auto; font-family:var(--mono); font-size:0.74rem;
  display:flex; flex-direction:column; gap:3px;
}
.log .entry { color:var(--muted); padding:2px 0; border-bottom:1px solid var(--surface2); }
.log .entry:last-child { border-bottom:none; color:var(--text); }

/* === Result === */
.result-hero {
  text-align:center; padding:30px 16px; border-radius:14px;
  background:linear-gradient(180deg, var(--surface2), var(--surface));
}
.result-hero.rose-win { background:linear-gradient(180deg, rgba(232,220,196,0.2), rgba(232,220,196,0.05)); border:1px solid var(--rose-dark); }
.result-hero.blood-win { background:linear-gradient(180deg, rgba(214,50,67,0.2), rgba(214,50,67,0.05)); border:1px solid var(--blood); }
.result-emoji { font-size:4.5rem; margin-bottom:6px; }
.result-title { font-size:1.6rem; letter-spacing:6px; margin-bottom:6px; }
.result-title.rose { color:var(--rose); }
.result-title.blood { color:var(--blood-bright); }
.result-sub { font-size:0.92rem; color:var(--muted); }

/* === Round table === */
.round-table {
  position:relative;
  width:100%;
  max-width:460px;
  margin:0 auto;
  aspect-ratio: 1;
  background:radial-gradient(circle at center, rgba(212,175,55,0.08), transparent 70%);
}
.table-center {
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%, -50%);
  width:36%; height:36%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(34,32,42,0.9), rgba(22,21,26,0.7));
  border:2px solid var(--surface3);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:4px;
  font-family:var(--mono); font-size:0.72rem;
  color:var(--muted);
}
.table-center .round-num {
  color:var(--gold); font-size:1.15rem; letter-spacing:2px;
}
.table-center .phase-info {
  color:var(--rose); font-size:0.7rem;
}
.seat {
  position:absolute;
  width:80px;
  transform:translate(-50%, -50%);
  display:flex; flex-direction:column;
  align-items:center; gap:3px;
  transition:all 0.3s ease;
  z-index:2;
}
.seat-avatar {
  width:46px; height:46px; border-radius:50%;
  background:linear-gradient(135deg, var(--surface3), var(--surface2));
  border:2px solid var(--surface3);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:1.0rem;
  color:var(--text);
  position:relative;
}
.seat.is-me .seat-avatar { border-color:var(--rose); box-shadow:0 0 10px var(--rose-glow); }
.seat.is-coin .seat-avatar { background:linear-gradient(135deg, var(--gold), var(--rose-dark)); color:var(--bg); }
.seat.is-turn .seat-avatar {
  border:3px solid var(--gold);
  box-shadow:0 0 18px var(--gold);
  animation: turnPulse 1.2s ease infinite;
}
.seat.is-start .seat-avatar::after {
  content:'▶';
  position:absolute;
  top:-4px; right:-8px;
  color:var(--amber); font-size:0.85rem;
  text-shadow:0 0 4px var(--amber);
}
.seat.night-seen .seat-avatar {
  border:3px solid var(--gold);
  box-shadow:0 0 14px rgba(212,175,55,0.6);
}
.seat.magic9-seen .seat-avatar {
  border:3px solid var(--blood-bright);
  box-shadow:0 0 12px rgba(214,50,67,0.5);
}
.seat-name {
  font-size:0.85rem;
  font-weight:700;
  text-align:center;
  max-width:90px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  background:linear-gradient(135deg, var(--surface), var(--surface2));
  padding:3px 8px;
  border-radius:6px;
  color:var(--text);
  border:1px solid var(--surface3);
  box-shadow:0 2px 6px rgba(0,0,0,0.4);
  letter-spacing:0.5px;
}
.seat.is-me .seat-name {
  color:var(--rose);
  border-color:var(--rose-dark);
  background:linear-gradient(135deg, rgba(232,220,196,0.15), rgba(184,168,136,0.05));
}
.seat.is-coin .seat-name {
  color:var(--gold);
  border-color:var(--gold);
  background:linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.05));
}
.seat.night-seen .seat-name {
  color:var(--gold);
  border-color:var(--gold);
}
.seat.magic9-seen .seat-name {
  color:var(--blood-bright);
  border-color:var(--blood-bright);
}
.seat-status {
  font-size:0.68rem;
  font-family:var(--mono);
  padding:2px 6px;
  border-radius:4px;
  margin-top:1px;
  font-weight:700;
  white-space:nowrap;
}
.seat-status.played { background:rgba(45,255,138,0.25); color:var(--green); border:1px solid var(--green); }
.seat-status.passed { background:rgba(122,114,104,0.25); color:var(--text); border:1px solid var(--muted); }
.seat-status.waiting { background:rgba(255,176,32,0.2); color:var(--amber); border:1px solid var(--amber); }
.seat-status.acting { background:rgba(212,175,55,0.35); color:var(--gold); border:1px solid var(--gold); animation: turnPulse 1.2s ease infinite; }
.seat-handcount {
  position:absolute;
  bottom:-2px; right:-4px;
  font-size:0.6rem;
  background:var(--surface);
  border:1px solid var(--surface3);
  border-radius:8px;
  padding:1px 4px;
  font-family:var(--mono);
  color:var(--text);
}
@keyframes turnPulse {
  0%, 100% { box-shadow:0 0 12px var(--gold); }
  50% { box-shadow:0 0 24px var(--gold); }
}

/* === Progress info panel below table === */
.progress-info {
  background:linear-gradient(135deg, rgba(212,175,55,0.1), rgba(212,175,55,0.02));
  border:1px solid var(--gold);
  border-radius:10px;
  padding:10px 12px;
  display:flex; flex-direction:column; gap:6px;
}
.progress-info .label {
  font-size:0.7rem; color:var(--gold); letter-spacing:2px;
  text-transform:uppercase;
}
.progress-info .value {
  font-size:0.92rem; color:var(--text); font-weight:600;
}

/* === Animations === */
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:none; opacity:1; } }
.fade-in { animation: fadeIn 0.5s ease; }
.slide-up { animation: slideUp 0.4s ease; }

@keyframes nightPulse {
  0%, 100% { opacity:0.6; }
  50% { opacity:1; }
}
.night-pulse { animation: nightPulse 2s ease infinite; }

.night-scene {
  background: linear-gradient(180deg, #0a0a0d 0%, #1a1828 50%, #0a0a0d 100%);
  border-radius:12px; padding:24px 14px; text-align:center;
}
.night-icon { font-size:4rem; margin-bottom:10px; }
</style>
</head>
<body>

<!-- ============================================================ LOBBY ============================================================ -->
<div id="screen-lobby" class="screen active">
  <h1 class="title-main">血と刃の白薔薇</h1>
  <div class="title-sub">BLOOD AND BLADE OF WHITE ROSE</div>
  <div class="panel">
    <p style="font-size:0.85rem; color:var(--muted); line-height:1.7;">
      <strong style="color:var(--rose);">白薔薇陣営</strong>と<strong style="color:var(--blood-bright);">血刃陣営</strong>に分かれて争う正体隠匿ゲーム。<br>
      与えられた役職を上手く隠匿しながら、自分の陣営の勝利に貢献せよ。
    </p>
  </div>
  <input class="input" id="in-name" type="text" placeholder="ニックネーム（最大12文字）" maxlength="12">
  <button class="btn btn-rose" onclick="srCreateRoom()">🏠 部屋を作る（ホスト）</button>
  <div class="divider"></div>
  <div class="row">
    <input class="input code-input" id="in-code" type="number" placeholder="0000" maxlength="4">
    <button class="btn btn-gold" onclick="srJoinRoom()">参加</button>
  </div>
  <button class="btn btn-blood" onclick="srShowSoloLobby()">🤖 ひとりで遊ぶ（CPU対戦）</button>
  <div id="lobby-status" class="status-txt"></div>
  <div id="lobby-error" class="error"></div>
</div>

<!-- ============================================================ SOLO SETUP ============================================================ -->
<div id="screen-solo" class="screen">
  <h2>CPU対戦設定</h2>
  <input class="input" id="solo-name" type="text" placeholder="あなたの名前" maxlength="12">
  <div class="panel">
    <div style="text-align:center; margin-bottom:8px; color:var(--muted); font-size:0.85rem;">プレイ人数</div>
    <div class="count-selector">
      <button class="count-btn" data-n="5" onclick="srSetSoloCount(5)">5</button>
      <button class="count-btn" data-n="6" onclick="srSetSoloCount(6)">6</button>
      <button class="count-btn" data-n="7" onclick="srSetSoloCount(7)">7</button>
      <button class="count-btn" data-n="8" onclick="srSetSoloCount(8)">8</button>
      <button class="count-btn" data-n="9" onclick="srSetSoloCount(9)">9</button>
      <button class="count-btn" data-n="10" onclick="srSetSoloCount(10)">10</button>
    </div>
    <div class="count-label" id="solo-count-label">CPU: 4人 / あなた: 1人</div>
  </div>
  <details class="panel">

<script>
// ============================================================
// FIREBASE CONFIG
// ============================================================
const FB_URL = 'https://playgame-3e7ba-default-rtdb.firebaseio.com';
let fbRoom = '';
let fbListener = null;
let fbLastSeen = {};

async function fbPut(sub, data){
  if(!fbRoom) return;
  try {
    await fetch(`${FB_URL}/rooms/${fbRoom}/${sub}.json`, {method:'PUT', body:JSON.stringify(data)});
  } catch(e){ console.warn('fbPut error', e); }
}
async function fbGet(sub){
  if(!fbRoom) return null;
  try {
    const r = await fetch(`${FB_URL}/rooms/${fbRoom}/${sub}.json`);
    return await r.json();
  } catch(e){ return null; }
}
async function fbDel(sub){
  if(!fbRoom) return;
  try { await fetch(`${FB_URL}/rooms/${fbRoom}/${sub}.json`, {method:'DELETE'}); } catch(e){}
}
function fbBroadcast(msg){
  if(!fbRoom) return;
  const k = 'b_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  fbPut('broadcast/' + k, {...msg, ts:Date.now()});
}
function fbSendTo(pid, msg){
  if(!fbRoom) return;
  const k = 'p_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  fbPut(`private/${pid}/${k}`, {...msg, ts:Date.now()});
}
function fbSendToHost(msg){
  if(!fbRoom) return;
  const k = 'h_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  fbPut(`action/${k}`, {...msg, sender:myId, ts:Date.now()});
}
function fbListen(){
  if(fbListener) clearInterval(fbListener);
  fbListener = setInterval(fbPoll, 1100);
  fbPoll();
}
async function fbPoll(){
  if(!fbRoom) return;
  // Broadcast
  const b = await fbGet('broadcast') || {};
  Object.entries(b).forEach(([k,v])=>{
    if(!v||fbLastSeen[k]) return; fbLastSeen[k]=true;
    onMsg(v, v.sender);
  });
  // Private
  const p = await fbGet(`private/${myId}`) || {};
  Object.entries(p).forEach(([k,v])=>{
    if(!v||fbLastSeen['p_'+k]) return; fbLastSeen['p_'+k]=true;
    onMsg(v, null);
  });
  // Host action
  if(isHost){
    const a = await fbGet('action') || {};
    Object.entries(a).forEach(([k,v])=>{
      if(!v||fbLastSeen['a_'+k]) return; fbLastSeen['a_'+k]=true;
      onMsg(v, v.sender);
    });
  }
}
function fbClose(){
  if(fbListener) clearInterval(fbListener);
  fbListener = null; fbRoom = ''; fbLastSeen = {};
}
async function checkFbConfig(){
  try {
    const r = await fetch(`${FB_URL}/.json?shallow=true`);
    return r.ok;
  } catch(e){ return false; }
}

// ============================================================
// CONSTANTS
// ============================================================

// 公式ルールブックの人数別カード配分と勝利条件
// winBudRose: 白薔薇陣営勝利に必要な生贄枠の蕾枚数
// winBudBlood: 血刃陣営勝利に必要な死亡枠の蕾枚数
// ============================================================
// 役職カードの配分（人数別）
// ============================================================
const SR_DIST = {

  6:  {whiteRose:1, bishop:1, believer:2, greatSword:0, doubleKnife:1, darkKnife:1},

  10: {whiteRose:1, bishop:1, believer:4, greatSword:2, doubleKnife:1, darkKnife:1},
};

// ============================================================
// 勝利条件（人数別）★ここを修正すれば簡単に調整可能
// winBudRose : 白薔薇陣営勝利に必要な「生贄枠の蕾(司教+信者)」枚数
// winBudBlood: 血刃陣営勝利に必要な「死亡枠の蕾(司教+信者)」枚数
// ※白薔薇のカードは含めない（蕾＝司教+信者のみで数える）
// ※プレイヤー数が変わったらここの値を変更してください
// ============================================================
const SR_WIN = {
  5:  {winBudRose:3, winBudBlood:4},
  6:  {winBudRose:4, winBudBlood:5},
  7:  {winBudRose:4, winBudBlood:6},
  8:  {winBudRose:5, winBudBlood:7},
  9:  {winBudRose:6, winBudBlood:7},
  10: {winBudRose:6, winBudBlood:9},
};

// 人数別に配分+勝利条件をマージして取得
function srGetDistForN(n){
  const base = SR_DIST[n];
  const win = SR_WIN[n];
  if(!base || !win) return null;
  return {...base, ...win};
}
const SR_MAGIC = [
  {n:1,  name:'指定1人は必ずカードを出す', desc:'手札を1枚以上持つ任意の他プレイヤーを1人指定。その人は手番でパスできず必ずカードを出す。'},

  {n:3,  name:'右隣の人はランダムにカードを出す', desc:'右隣のプレイヤーは手番でパスできず、手札からランダムに1枚を裏向きで出す。'},
  {n:4,  name:'左隣の人はランダムにカードを出す', desc:'左隣のプレイヤーは手番でパスできず、手札からランダムに1枚を裏向きで出す。'},
  {n:5,  name:'指定2人は同じ行動を行う', desc:'任意の他プレイヤーを2人指定。先のプレイヤー(A)がカードを出したらBも出す。Aがパスならもパス。'},
  {n:6,  name:'自分の手番を最後にしてもよい', desc:'通常どおり最初に手番を行うか、最後に行うかを選べる。'},
  {n:7,  name:'指定1人は<幽魂>を1枚得る', desc:'任意の他プレイヤーを1人指定。その人はボード横の<幽魂>を1枚取り手札に加える。'},
  {n:8,  name:'両隣の人はカードを出す', desc:'左隣・右隣のプレイヤーは手番でパスできず必ずカードを出す。'},
  {n:9,  name:'<暗刃>が<白薔薇>と<司教>を確認', desc:'<暗刃>は目を開け、<白薔薇>と<司教>を確認できる。'},
  {n:10, name:'公開前に1人指定し、カードを変えさせる', desc:'カードを出しかつ手札を持つ任意の他プレイヤーを指定。出したカードを手札に戻し、別の1枚を出させる（任意効果）。'},
  {n:11, name:'指定1人の手札をランダムに1枚見る', desc:'任意の他プレイヤー1人の手札からカードを1枚引き、表側を自分だけで確認してから返す。'},
  {n:12, name:'指定1人は必ずカードを出す', desc:'手札を1枚以上持つ任意の他プレイヤーを1人指定。その人は手番でパスできず必ずカードを出す。'},
];

// ============================================================
// STATE
// ============================================================
let myId = null;
let myName = '';
let isHost = false;
let isSolo = false;
let roomCode = '';
let srSoloCount = 5;
// Full state (host has, others read from gs)
let srFs = null;
// Public state (broadcast)
let srGs = null;
// Private state (each player)
let srMyRole = null;
let srMyCards = [];   // [{id, type}]
let srMyChip = null;  // 1-5, null when placed
let srAiTimer = null;
let srNightStep = 0;
let srMyNightSeen = []; // 夜に見つめ合った他プレイヤーのID（ゲーム中ずっと記憶）
let srMyMagic9Seen = []; // 魔法効果9で確認した白薔薇/司教のID（暗刃のみ）
let srCustomDist = null; // カスタム役職配分（nullならデフォルト使用）

function genId(){ return 'p_' + Math.random().toString(36).substr(2,9) + '_' + Date.now().toString(36); }

// ============================================================
// HELPERS
// ============================================================
function g(id){ return document.getElementById(id); }
function mk(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }
function show(scr){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = g('screen-' + scr);
  if(el) el.classList.add('active');
}
function setErr(msg){ const el=g('lobby-error'); if(el) el.textContent=msg||''; }
function setSt(msg){ const el=g('lobby-status'); if(el) el.textContent=msg||''; }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function nextIdx(idx, n){ return (idx+1) % n; }
function prevIdx(idx, n){ return (idx-1+n) % n; }

// ============================================================
// ROOM
// ============================================================
async function srCreateRoom(){
  if(!(await checkFbConfig())){ setErr('接続失敗'); return; }
  const name = g('in-name').value.trim();
  if(!name){ setErr('名前を入力してください'); return; }
  myName = name; isHost = true;
  const code = Array.from({length:4}, ()=>Math.floor(Math.random()*10)).join('');
  roomCode = code; fbRoom = 'SR-' + code;
  setSt('接続中...');
  try {
    myId = genId();
    await fbDel('');
    await fbPut('meta', {host:myId, game:'shirobara', ts:Date.now()});
    srFs = {
      phase:'waiting',
      players:[{id:myId, name:myName, role:null, isHost:true, alive:true}],
      coinIdx:0,
      log:[],
      chipsPlaced:[],
      board:{ whiteRose:null, sacrifice:[], dead:[], bloodBlade:[], ghostSide:[] },
    };
    srGs = srPub(srFs);
    fbListen();
    setErr(''); setSt('');
    g('disp-code').textContent = code;
    show('waiting');
    srBcast();
  } catch(e){ setErr('エラー: ' + e.message); }
}

async function srJoinRoom(){
  if(!(await checkFbConfig())){ setErr('接続失敗'); return; }
  const name = g('in-name').value.trim();
  if(!name){ setErr('名前を入力してください'); return; }
  const code = g('in-code').value.trim();
  if(!/^\d{4}$/.test(code)){ setErr('4桁の数字を入力'); return; }
  myName = name; isHost = false; roomCode = code;
  fbRoom = 'SR-' + code;
  setSt('接続中...');
  try {
    myId = genId();
    const meta = await fbGet('meta');
    if(!meta){ setErr('ルームが見つかりません'); return; }
    if(meta.game !== 'shirobara'){ setErr('ゲームの種類が違います'); return; }
    fbListen();
    fbSendToHost({type:'sr_join', name:myName, id:myId});
    setErr(''); setSt('接続しました');
    show('waiting');
    g('disp-code').textContent = code;
    g('btn-start').style.display = 'none';
    // Retry join (host might be slow)
    let retries = 0;
    const retryJoin = setInterval(()=>{
      if(!fbRoom || retries>=5) { clearInterval(retryJoin); return; }
      if(srGs?.players?.find(p=>p.id===myId)) { clearInterval(retryJoin); return; }
      fbSendToHost({type:'sr_join', name:myName, id:myId});
      retries++;
    }, 2000);
  } catch(e){ setErr('参加失敗'); }
}

function srLeaveRoom(){ fbClose(); srReset(); show('lobby'); }
function srLeaveGame(){ if(srAiTimer){clearTimeout(srAiTimer); srAiTimer=null;} fbClose(); srReset(); show('lobby'); }
function srReset(){
  srFs = null; srGs = null; srMyRole = null; srMyCards = [];
  srMyChip = null; isSolo = false; isHost = false; myId = null;
  srMyNightSeen = []; srMyMagic9Seen = [];
  fbRoom = ''; fbLastSeen = {};
}

function srUpdateSoloUI(){

  });

}

function srResetSoloRoleDist(){
  srCustomDist = null;
  srRenderSoloRoleCustom();
}

function srRenderSoloRoleCustom(){
  const body = g('solo-role-custom-body');
  if(!body) return;
  const dist = srCustomDist || srGetDistForN(srSoloCount) || srGetDistForN(5);
  const n = srSoloCount;
  let total = 0;
  const items = [
    {key:'whiteRose', label:'🌹 白薔薇', team:'rose', desc:'(必須1枚)'},
    {key:'bishop',    label:'⛪ 司教',   team:'rose', desc:'(蕾)'},
    {key:'believer',  label:'🙏 信者',   team:'rose', desc:'(蕾)'},
    {key:'greatSword',label:'⚔️ 巨刃',   team:'blood', desc:''},
    {key:'doubleKnife',label:'🗡️ 双刃',  team:'blood', desc:'(必須1枚推奨)'},
    {key:'darkKnife', label:'🔪 暗刃',   team:'blood', desc:''},
  ];
  let html = '';
  items.forEach(it=>{
    const count = dist[it.key] || 0;
    total += count;
    const teamColor = it.team==='rose'?'var(--rose)':'var(--blood-bright)';
    const isLocked = it.key==='whiteRose';
    html += `<div style="display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--surface); border:1px solid var(--surface3); border-radius:6px;">
      <span style="flex:1; color:${teamColor}; font-size:0.85rem;">${it.label} <span style="color:var(--muted); font-size:0.7rem;">${it.desc}</span></span>
      <button class="count-btn" style="width:32px; height:32px; ${isLocked?'opacity:0.3;':''}" ${isLocked?'disabled':''} onclick="srChangeSoloRoleCount('${it.key}', -1)">−</button>
      <span style="min-width:24px; text-align:center; font-family:var(--mono); font-size:1.1rem; color:var(--gold);">${count}</span>
      <button class="count-btn" style="width:32px; height:32px; ${isLocked?'opacity:0.3;':''}" ${isLocked?'disabled':''} onclick="srChangeSoloRoleCount('${it.key}', 1)">+</button>
    </div>`;
  });
  body.innerHTML = html;
  const status = g('solo-role-custom-status');
  const roseCount = (dist.whiteRose||0) + (dist.bishop||0) + (dist.believer||0);
  const bloodCount = (dist.greatSword||0) + (dist.doubleKnife||0) + (dist.darkKnife||0);
  const budTotal = (dist.bishop||0) + (dist.believer||0);
  const winRose = dist.winBudRose != null ? dist.winBudRose : (dist.winBud || Math.max(2, Math.ceil(budTotal/2)));
  const winBlood = dist.winBudBlood != null ? dist.winBudBlood : (dist.winBud || Math.max(2, Math.ceil(budTotal/2)));
  if(total === n){
    status.style.color = 'var(--green)';
    status.innerHTML = `✅ 合計 ${total}/${n}人（🌹白薔薇陣営 ${roseCount}人、🗡️血刃陣営 ${bloodCount}人）<br>
      <span style="color:var(--rose); font-size:0.72rem;">🌹勝利: 蕾 ${winRose}枚 生贄</span>　
      <span style="color:var(--blood-bright); font-size:0.72rem;">🗡️勝利: 蕾 ${winBlood}枚 殺害</span>`;
  } else if(total < n){
    status.style.color = 'var(--amber)';
    status.innerHTML = `⚠️ あと ${n-total}枚追加が必要（現在 ${total}/${n}）`;
  } else {
    status.style.color = 'var(--red)';
    status.innerHTML = `❌ ${total-n}枚減らしてください（現在 ${total}/${n}）`;
  }
}

function srChangeSoloRoleCount(key, delta){
  if(!srCustomDist) srCustomDist = {...(srGetDistForN(srSoloCount) || srGetDistForN(5))};
  const cur = srCustomDist[key] || 0;
  const next = cur + delta;
  if(next < 0) return;
  if(next > 5) return;
  srCustomDist[key] = next;
  const budTotal = (srCustomDist.bishop||0) + (srCustomDist.believer||0);
  const need = Math.max(2, Math.ceil(budTotal / 2));
  srCustomDist.winBudRose = need;
  srCustomDist.winBudBlood = need;
  srCustomDist.winBud = need; // 旧互換
  srRenderSoloRoleCustom();
}

// ============================================================
// HOST MESSAGES
// ============================================================
function onMsg(d, senderId){
  if(!d || !d.type) return;
  if(isHost && d.type.startsWith('sr_action_')){ srHostAction(d, senderId); return; }
  if(isHost && d.type === 'sr_join'){ srHostJoin(d, senderId); return; }
  // Public broadcasts
  if(d.type === 'sr_gs'){ srGs = d.s; srOnGsUpdate(); return; }
  if(d.type === 'sr_private'){
    if(d.role) srMyRole = d.role;
    if(d.cards) srMyCards = d.cards;
    if(d.chip !== undefined) srMyChip = d.chip;
    srUpdateGame();
    return;
  }
  if(d.type === 'sr_night_announce'){
    srShowNightAnnounce(d);
    return;
  }
  if(d.type === 'sr_show_role'){ srShowRoleScreen(); return; }
  if(d.type === 'sr_modal_msg'){ srShowMessageModal(d.title, d.body); return; }
  if(d.type === 'sr_magic9_reveal'){
    // 暗刃が白薔薇と司教を確認 → 記憶する
    (d.targetIds||[]).forEach(id=>{ if(!srMyMagic9Seen.includes(id)) srMyMagic9Seen.push(id); });
    srShowMessageModal('🔪 暗刃の確認', `白薔薇と司教は次のプレイヤーです（ゲーム中ずっと記憶されます）:<br><strong style="color:var(--rose);">${d.names}</strong>`);
    return;
  }
  if(d.type === 'sr_result'){ srShowResult(); return; }
}

function srHostJoin(d){
  if(!srFs || srFs.phase!=='waiting') return;
  if(srFs.players.length >= 10){ fbSendTo(d.id, {type:'sr_modal_msg', title:'満員', body:'10人まで'}); return; }
  if(srFs.players.find(p=>p.id===d.id)) return;
  srFs.players.push({id:d.id, name:d.name, role:null, isHost:false, alive:true});
  srBcast();
  srFs.log.push(`👤 ${d.name} が参加しました`);
}

function srHostAction(d, senderId){
  if(!srFs) return;
  const action = d.type.replace('sr_action_','');
  if(action === 'play_card'){ srHostPlayCard(senderId, d.cardId); }
  else if(action === 'pass'){ srHostPass(senderId); }
  else if(action === 'pick_target'){ srHostPickTarget(senderId, d.payload); }
  else if(action === 'pick_replace_card'){ srHostPickReplace(senderId, d.cardId); }
  else if(action === 'magic10_pick'){ srHostMagic10Pick(senderId, d.targetId); }
  else if(action === 'rematch'){ srHostRematch(); }
  else if(action === 'night_ack'){ srHostNightAck(senderId); }
}

// ============================================================
function srBcast(){
  if(!srFs) return;
  srGs = srPub(srFs);
  if(isSolo){ srOnGsUpdate(); return; }
  fbBroadcast({type:'sr_gs', s:srGs});
}
function srPub(f){
  return {
    phase: f.phase,
    subPhase: f.subPhase || null,
    players: f.players.map(p=>({
      id:p.id, name:p.name, isHost:p.isHost, alive:p.alive,
      handCount: p.hand ? p.hand.length : 0,
      hasChip: p.chip != null,
      isCpu: p.isCpu,
      // role is revealed only at end
      role: f.phase==='result' ? p.role : null,
    })),
    coinIdx: f.coinIdx,
    coinHolderId: f.players[f.coinIdx]?.id,
    chipsPlaced: f.chipsPlaced || [],
    activeMagic: f.activeMagic || null,
    turnIdx: f.turnIdx,
    turnPlayerId: f.turnIdx!=null ? f.players[f.turnIdx]?.id : null,
    playedCards: f.playedCards ? f.playedCards.map(c=>({playerId:c.playerId, faceUp:f.revealMode||false, type:f.revealMode?c.type:null})) : [],
    revealMode: f.revealMode || false,
    revealedCards: f.revealedCards || null,
    board: f.board,
    log: f.log.slice(-30),
    round: f.round || 1,
    winner: f.winner || null,
    winReason: f.winReason || '',
    playerCount: f.players.length,
    winBud: f.winBud,
    winBudRose: f.winBudRose != null ? f.winBudRose : f.winBud,
    winBudBlood: f.winBudBlood != null ? f.winBudBlood : f.winBud,
    targetPickerId: f.targetPickerId,
    targetPickerMagic: f.targetPickerMagic,
    targetPickerCount: f.targetPickerCount,
    targetCandidateIds: f.targetCandidateIds || null,
    pendingActions: f.pendingActions || [],
    forcedPlayers: f.forcedPlayers || [],
    randomPlayers: f.randomPlayers || [],
    syncedPairs: f.syncedPairs || [],
    phase1StartId: f.phase1StartId || null,
    phase2StartId: f.phase2StartId || null,
    turnOrder: f.turnOrder || [],
    turnPtr: f.turnPtr != null ? f.turnPtr : null,
    lastMagic: f.lastMagic || null, // このラウンドの魔法効果（解決後も表示し続ける）
  };
}

// START GAME
// ============================================================
function srStartGame(){
  if(!srFs || srFs.phase !== 'waiting') return;
  if(srFs.players.length < 5){ alert('5人以上必要です'); return; }
  srStartGameInternal();
}

function srStartGameInternal(){
  const n = srFs.players.length;
  const dist = srCustomDist || srGetDistForN(n);
  if(!dist){ alert('5〜10人のみ対応'); return; }
  // バリデーション：合計枚数が人数と一致するか
  let totalCards = 0;
  const META_KEYS = ['winBud','winBudRose','winBudBlood'];
  Object.keys(dist).forEach(k=>{ if(!META_KEYS.includes(k)) totalCards += dist[k]; });
  if(totalCards !== n){
    alert(`役職構成の合計（${totalCards}）が人数（${n}）と一致しません`);
    return;
  }
  if(!dist.whiteRose || dist.whiteRose < 1){
    alert('白薔薇は必ず1枚必要です');
    return;
  }
  // 勝利条件：旧形式（winBud のみ）との互換のためのフォールバック
  srFs.winBudRose = dist.winBudRose != null ? dist.winBudRose : (dist.winBud || 3);
  srFs.winBudBlood = dist.winBudBlood != null ? dist.winBudBlood : (dist.winBud || 3);
  srFs.winBud = srFs.winBudRose; // 旧形式の互換
  srFs.round = 1;
  // Build role pool
  const rolePool = [];
  Object.keys(dist).forEach(k=>{
    if(META_KEYS.includes(k)) return;
    for(let i=0; i<dist[k]; i++) rolePool.push(k);
  });
  const shuffledRoles = shuffle(rolePool);
  // 水晶チップは1〜n のユニーク値（同じ番号は存在しない）
  const chipPool = shuffle(Array.from({length:n}, (_,i)=>i+1));
  // Assign roles & chips
  srFs.players.forEach((p,i)=>{
    p.role = shuffledRoles[i];
    // Initial hand: drawn role card + believer + ghost
    p.hand = [
      {id:`c${i}r`, type:p.role},
      {id:`c${i}b`, type:'believer'},
      {id:`c${i}g`, type:'ghost'},
    ];
    // ユニークな水晶チップ
    p.chip = chipPool[i];
  });
  // Coin to random player initially
  srFs.coinIdx = Math.floor(Math.random()*n);
  srFs.log.push(`🎲 ゲーム開始（${n}人）`);
  srFs.log.push(`🪙 最初のコイン保持者：${srFs.players[srFs.coinIdx].name}`);
  // Set up double knife special: 2nd 双刃 card available on board
  srFs.doubleKnifeExtraTaken = false;
  // Phase: role_reveal -> night
  srFs.phase = 'role_reveal';
  // Send private info to each player
  srFs.players.forEach(p=>{
    if(p.id === myId){
      srMyRole = p.role;
      srMyCards = p.hand.map(c=>({id:c.id, type:c.type}));
      srMyChip = p.chip;
    } else if(!p.isCpu){
      fbSendTo(p.id, {type:'sr_private', role:p.role, cards:p.hand.map(c=>({id:c.id,type:c.type})), chip:p.chip});
    }
  });
  srBcast();
  if(!isSolo) fbBroadcast({type:'sr_show_role'});
  srShowRoleScreen();
}

function srRunNightHost(){
  if(!isHost) return;

  srNightBroadcast({step:0, title:'夜が訪れた', icon:'🌙',
    text:'全員、目を閉じてください。', cd:4});
  setTimeout(()=>{
    // Step 1: 中核役職が目を開ける (12秒 = 見つめ合う時間を確保)
    const seeIds = srFs.players.filter(p=>['whiteRose','bishop','doubleKnife','greatSword'].includes(p.role)).map(p=>p.id);
    srNightBroadcast({step:1, title:'目を開ける役職', icon:'👁',

      seeIds, cd:12});
    setTimeout(()=>{
      // Step 2: 双刃が目を開けて幽魂↔双刃を交換 (8秒)
      const dkPlayer = srFs.players.find(p=>p.role==='doubleKnife');
      if(dkPlayer){
        // Replace ghost with extra doubleKnife card
        const ghostIdx = dkPlayer.hand.findIndex(c=>c.type==='ghost');
        if(ghostIdx>=0){
          const ghostCard = dkPlayer.hand.splice(ghostIdx,1)[0];
          srFs.board.ghostSide.push(ghostCard);
          dkPlayer.hand.push({id:'extra_dk', type:'doubleKnife'});
        }
        // Update private for double knife player
        if(dkPlayer.id === myId){
          srMyCards = dkPlayer.hand.map(c=>({id:c.id, type:c.type}));
        } else if(!dkPlayer.isCpu){
          fbSendTo(dkPlayer.id, {type:'sr_private', cards:dkPlayer.hand.map(c=>({id:c.id,type:c.type}))});

      srNightBroadcast({step:2, title:'双刃の手番', icon:'🗡️',

        seeIds: dkPlayer ? [dkPlayer.id] : [], cd:8});
      setTimeout(()=>{
        // Step 3: 終了→ゲーム開始 (4秒)
        srNightBroadcast({step:3, title:'夜時間 終了', icon:'☀️',
          text:'全員、目を開けてください。ラウンド1を開始します。', cd:4});
        setTimeout(()=>{
          srStartRound();
        }, 4500);
      }, 8500);
    }, 12500);
  }, 4500);
}

function srHostCoinPass(actorId, targetId){
  if(srFs.phase !== 'phase1') return;
  const coinHolder = srFs.players[srFs.coinIdx];
  if(coinHolder.id !== actorId) return;
  const target = srFs.players.find(p=>p.id===targetId);
  if(!target || target.chip == null || target.id === actorId) return;
  // Transfer coin
  const newIdx = srFs.players.findIndex(p=>p.id===targetId);
  srFs.coinIdx = newIdx;
  // Target reveals chip and places on smallest empty slot
  const chipNum = target.chip;
  const slotIdx = srFs.chipsPlaced.length + 1; // 1-5
  srFs.chipsPlaced.push({playerId:target.id, chipNumber:chipNum, slotIdx});
  target.chip = null;
  srFs.log.push(`🪙 ${coinHolder.name} → ${target.name} (水晶チップ ${chipNum} を公開)`);
  srFs.log.push(`✨ 魔法効果 ${chipNum}: ${SR_MAGIC[chipNum-1].name}`);
  // Activate magic effect
  srFs.activeMagic = chipNum;
  srFs.lastMagic = chipNum; // ラウンド中ずっと記録
  srBcast();
  // Resolve magic effect
  srResolveMagic(chipNum, target.id);
}

function srHostPickTarget(actorId, payload){
  if(!srFs) return;
  if(payload.kind === 'coinPass'){
    srHostCoinPass(actorId, payload.targetId);
  } else if(payload.kind === 'magicTarget'){
    srHostMagicTarget(actorId, payload.targetIds);
  } else if(payload.kind === 'replaceTarget'){
    srHostReplaceTarget(actorId, payload.targetId);
  }
}

// ============================================================
// MAGIC EFFECTS RESOLUTION
// ============================================================
function srResolveMagic(num, holderId){
  const holderIdx = srFs.players.findIndex(p=>p.id===holderId);
  const n = srFs.players.length;
  // ===== 指定者が必要な効果 (1, 5, 7, 10, 11, 12) =====
  // ※指定者は水晶チップを公開した本人（=コインを受け取った人 = holderId）
  if([1,5,7,10,11,12].includes(num)){
    // 指定可能な対象者がいるかチェック
    const others = srFs.players.filter(p=>p.id !== holderId);
    let candidates;
    if(num === 1 || num === 12){
      // 「手札を1枚以上持つ任意の他プレイヤー」
      candidates = others.filter(p=>(p.hand||[]).length > 0);
    } else if(num === 5){
      // 「手札を1枚以上持つ任意の他プレイヤーを2人」
      candidates = others.filter(p=>(p.hand||[]).length > 0);
    } else if(num === 7){
      // 「任意の他プレイヤー」（手札条件なし）
      // ※ボード横の幽魂が必要
      if(srFs.board.ghostSide.length === 0){
        srFs.log.push(`👻 ボード横に幽魂がないため魔法効果7は不発`);
        setTimeout(()=>srProceedToPhase2(holderId), 1500);
        return;
      }
      candidates = others;
    } else if(num === 10){
      // フェイズ2が終わったあとに発動するので、ここでは何もしない
      // 後でsrGoToPhase3で処理する
      srFs.magic10Pending = true;
      srFs.magic10HolderId = holderId;
      srProceedToPhase2(holderId);
      return;
    } else if(num === 11){
      // 「任意の他プレイヤー1人」（手札があれば見られる、なくても指定可）
      candidates = others;
    }
    // 対象が不足している場合
    if(num !== 7 && (!candidates || candidates.length === 0)){
      srFs.log.push(`🚫 魔法効果${num}: 指定可能な対象がいないため不発`);
      setTimeout(()=>srProceedToPhase2(holderId), 1500);
      return;
    }
    if(num === 5 && candidates.length < 2){
      srFs.log.push(`🚫 魔法効果5: 指定可能な対象が2人未満のため不発`);
      setTimeout(()=>srProceedToPhase2(holderId), 1500);
      return;
    }
    const cnt = num === 5 ? 2 : 1;
    srFs.targetPickerId = holderId;
    srFs.targetPickerMagic = num;
    srFs.targetPickerCount = cnt;
    srFs.targetCandidateIds = candidates.map(p=>p.id);
    srBcast();
    if(isSolo){
      const holder = srFs.players[holderIdx];
      if(holder.isCpu){
        setTimeout(()=>srCpuPickMagicTarget(), 1500);
      }
    }
    return;
  }
  // ===== 自動効果 =====
  // 2: シャッフルなしで公開（誰が何を出したか判別可能）
  if(num === 2){
    srFs.noShuffleAtReveal = true;
    srFs.log.push(`📜 効果2: 公開時にカードはシャッフルされず、誰が何を出したか分かります`);
    srProceedToPhase2(holderId);
    return;
  }
  // 3: 右隣の人はランダムにカードを出す
  if(num === 3){
    const right = srFs.players[prevIdx(holderIdx, n)];
    if(right && right.hand && right.hand.length > 0){
      srFs.randomPlayers.push(right.id);
      srFs.log.push(`🎲 効果3: 右隣の ${right.name} はランダムに1枚出す`);
    } else if(right){
      srFs.log.push(`🎲 効果3: 右隣の ${right.name} は手札なしのためパス`);
    }
    srProceedToPhase2(holderId);
    return;
  }
  // 4: 左隣の人はランダムにカードを出す
  if(num === 4){
    const left = srFs.players[nextIdx(holderIdx, n)];
    if(left && left.hand && left.hand.length > 0){
      srFs.randomPlayers.push(left.id);
      srFs.log.push(`🎲 効果4: 左隣の ${left.name} はランダムに1枚出す`);
    } else if(left){
      srFs.log.push(`🎲 効果4: 左隣の ${left.name} は手札なしのためパス`);
    }
    srProceedToPhase2(holderId);
    return;
  }
  // 6: 自分の手番を最後にしてもよい（holderが選択）
  if(num === 6){
    srFs.targetPickerId = holderId;
    srFs.targetPickerMagic = 6;
    srFs.targetPickerCount = 1;
    srBcast();
    if(isSolo && srFs.players[holderIdx].isCpu){
      setTimeout(()=>{
        // CPU: 戦略的に決定（とりあえずランダム）
        const goLast = Math.random() < 0.5;
        srHostMagicTarget(holderId, [goLast ? 'LAST' : 'FIRST']);
      }, 1500);
    }
    return;
  }
  // 8: 両隣の人はカードを出す（手札があれば必須）
  if(num === 8){
    const right = srFs.players[prevIdx(holderIdx, n)];
    const left = srFs.players[nextIdx(holderIdx, n)];
    const forced = [];
    if(right && right.hand && right.hand.length > 0){
      srFs.forcedPlayers.push(right.id);
      forced.push(right.name + '(右)');
    }
    if(left && left.hand && left.hand.length > 0){
      srFs.forcedPlayers.push(left.id);
      forced.push(left.name + '(左)');
    }
    if(forced.length > 0){
      srFs.log.push(`⚡ 効果8: ${forced.join('、')} は必ずカードを出す`);
    } else {
      srFs.log.push(`⚡ 効果8: 両隣とも手札なし`);
    }
    srProceedToPhase2(holderId);
    return;
  }
  // 9: 暗刃が白薔薇と司教を確認
  if(num === 9){
    const darkKnife = srFs.players.find(p=>p.role==='darkKnife');
    if(darkKnife){
      const targets = srFs.players.filter(p=>p.role==='whiteRose' || p.role==='bishop');
      const names = targets.map(p=>p.name).join('、');
      const targetIds = targets.map(p=>p.id);
      if(darkKnife.id === myId){
        targetIds.forEach(id=>{ if(!srMyMagic9Seen.includes(id)) srMyMagic9Seen.push(id); });
        srShowMessageModal('🔪 暗刃の確認', `白薔薇と司教は次のプレイヤーです（ゲーム中ずっと記憶されます）:<br><strong style="color:var(--rose);">${names}</strong>`);
      } else if(!darkKnife.isCpu){
        fbSendTo(darkKnife.id, {type:'sr_magic9_reveal', targetIds, names});
      }
      srFs.log.push(`🔪 効果9: 暗刃が白薔薇と司教を確認しました`);
    } else {
      srFs.log.push(`🔪 効果9: 暗刃は不在のため効果なし`);
    }
    setTimeout(()=>srProceedToPhase2(holderId), 2500);
    return;
  }
  // Fallback
  srProceedToPhase2(holderId);
}

function srHostMagicTarget(actorId, targetIds){
  if(!srFs) return;
  if(srFs.targetPickerId !== actorId) return;
  const magic = srFs.targetPickerMagic;
  const holderIdx = srFs.players.findIndex(p=>p.id===actorId);
  // Reset picker
  srFs.targetPickerId = null;
  srFs.targetPickerMagic = null;
  srFs.targetPickerCount = 0;
  srFs.targetCandidateIds = null;
  if(magic === 1 || magic === 12){
    const t = srFs.players.find(p=>p.id===targetIds[0]);
    if(t && (t.hand||[]).length > 0){
      srFs.forcedPlayers.push(targetIds[0]);
      srFs.log.push(`🎯 効果${magic}: ${t.name} は必ずカードを出す`);
    } else {
      srFs.log.push(`🎯 効果${magic}: 対象不在または手札なしのため不発`);
    }
  } else if(magic === 5){
    if(targetIds.length === 2){
      const t1 = srFs.players.find(p=>p.id===targetIds[0]);
      const t2 = srFs.players.find(p=>p.id===targetIds[1]);
      if(t1 && t2 && (t1.hand||[]).length > 0 && (t2.hand||[]).length > 0){
        srFs.syncedPairs.push(targetIds);
        srFs.log.push(`🔁 効果5: ${t1.name} と ${t2.name} は同じ行動を取る（先に手番の方に合わせる）`);
      } else {
        srFs.log.push(`🔁 効果5: 対象に手札なしまたは不在のため不発`);
      }
    }
  } else if(magic === 6){
    if(targetIds[0]==='LAST'){
      srFs.holderGoesLast = true;
      srFs.log.push(`🔚 効果6: コイン保持者は最後に手番を行う`);
    } else {
      srFs.log.push(`▶ 効果6: コイン保持者は通常通り最初に手番`);
    }
  } else if(magic === 7){
    const t = srFs.players.find(p=>p.id===targetIds[0]);
    if(t && srFs.board.ghostSide.length > 0){
      const ghost = srFs.board.ghostSide.shift();
      ghost.id = 'gn' + Date.now() + '_' + Math.floor(Math.random()*1000);
      t.hand.push(ghost);
      if(t.id === myId){ srMyCards = t.hand.map(c=>({id:c.id,type:c.type})); }
      else if(!t.isCpu){ fbSendTo(t.id, {type:'sr_private', cards:t.hand.map(c=>({id:c.id,type:c.type}))}); }
      srFs.log.push(`👻 効果7: ${t.name} は<幽魂>を1枚得た（手札+1）`);
    } else if(t){
      srFs.log.push(`👻 効果7: ボード横に幽魂がないため ${t.name} は何も得られない`);
    }
  } else if(magic === 11){
    const t = srFs.players.find(p=>p.id===targetIds[0]);
    if(t && (t.hand||[]).length > 0){
      const card = t.hand[Math.floor(Math.random()*t.hand.length)];
      const cardName = SR_ROLES[card.type] ? SR_ROLES[card.type].name : (card.type==='ghost'?'幽魂':card.type);
      const actorName = srFs.players.find(p=>p.id===actorId)?.name;
      if(actorId === myId){
        srShowMessageModal('👁 手札ピーク', `${t.name} の手札からランダムに1枚:<br><strong style="color:var(--gold); font-size:1.2rem;">${cardName}</strong>`);
      } else if(!srFs.players.find(p=>p.id===actorId)?.isCpu){
        fbSendTo(actorId, {type:'sr_modal_msg', title:'👁 手札ピーク',
          body:`${t.name} の手札からランダムに1枚:<br><strong style="color:var(--gold); font-size:1.2rem;">${cardName}</strong>`});
      }
      srFs.log.push(`👁 効果11: ${actorName} が ${t.name} の手札を1枚見た`);
    } else if(t){
      srFs.log.push(`👁 効果11: ${t.name} は手札なしのため見るカードがない`);
    }
  }
  srBcast();
  // フェイズ2へ
  if(magic !== 6){
    setTimeout(()=>srProceedToPhase2(srFs.players[srFs.coinIdx].id), 1500);
  } else {
    srProceedToPhase2(srFs.players[srFs.coinIdx].id);
  }
}

// ============================================================
// PHASE 2: CARD PLAY
// ============================================================
function srProceedToPhase2(holderId){
  if(!isHost) return;
  srFs.phase = 'phase2';
  srFs.activeMagic = null;
  const holderIdx = srFs.players.findIndex(p=>p.id===holderId);
  const n = srFs.players.length;
  // Build turn order
  if(srFs.holderGoesLast){
    // holder goes last
    srFs.turnOrder = [];
    for(let i=1; i<=n; i++) srFs.turnOrder.push(srFs.players[(holderIdx+i)%n].id);
    srFs.turnOrder.push(holderId); // wait, last is the n-th already
    srFs.turnOrder = srFs.turnOrder.slice(0,n); // ensure size n
    // Actually if holder goes last: order = [next, next+1, ..., holder]
    srFs.turnOrder = [];
    for(let i=1; i<=n; i++){
      srFs.turnOrder.push(srFs.players[(holderIdx+i)%n].id);
    }
    // Replace last with holder
    srFs.turnOrder[n-1] = holderId;
    srFs.holderGoesLast = false;
  } else {
    srFs.turnOrder = [];
    for(let i=0; i<n; i++) srFs.turnOrder.push(srFs.players[(holderIdx+i)%n].id);
  }
  srFs.turnPtr = 0;
  srFs.turnIdx = srFs.players.findIndex(p=>p.id===srFs.turnOrder[0]);
  srFs.phase2StartId = srFs.turnOrder[0]; // フェイズ2のスタートプレイヤー
  const startName = srFs.players.find(p=>p.id===srFs.phase2StartId)?.name || '?';
  srFs.log.push(`▶ フェイズ2 開始（手番開始：${startName}）`);
  // 効果5: syncedPairsを手番順に並べ替え（先に手番が来るプレイヤーをA、後をBに）
  // 万一 turnOrder が不完全でも安全に動作
  if(srFs.syncedPairs && srFs.syncedPairs.length > 0 && srFs.turnOrder && srFs.turnOrder.length > 0){
    srFs.syncedPairs = srFs.syncedPairs.map(pair=>{
      if(!Array.isArray(pair) || pair.length !== 2) return pair;
      const idx0 = srFs.turnOrder.indexOf(pair[0]);
      const idx1 = srFs.turnOrder.indexOf(pair[1]);
      // どちらか1人でもturnOrderにない（=途中退出など）→ そのペアを無効化
      if(idx0 < 0 || idx1 < 0){
        srFs.log.push(`⚠️ 効果5: 同期対象がturnOrderにないため無効化`);
        return null;
      }
      // 手番が先のID（小さいインデックス）をA、後をBにする
      if(idx1 < idx0){
        return [pair[1], pair[0]];
      }
      return pair;
    }).filter(pair=>pair !== null); // 無効化されたペアを除去
  }
  srBcast();
  srProcessTurn();
}

function srProcessTurn(){
  if(srFs.phase !== 'phase2') return;
  if(srFs.turnPtr >= srFs.turnOrder.length){ srGoToPhase3(); return; }
  const currentId = srFs.turnOrder[srFs.turnPtr];
  const currentPlayer = srFs.players.find(p=>p.id===currentId);
  if(!currentPlayer){ srFs.turnPtr++; srProcessTurn(); return; }
  srFs.turnIdx = srFs.players.findIndex(p=>p.id===currentId);
  // No cards in hand → auto pass
  if(!currentPlayer.hand || currentPlayer.hand.length === 0){
    srFs.log.push(`⏭ ${currentPlayer.name} は手札なし（自動パス）`);
    srFs.pendingActions.push({playerId:currentId, action:'pass'});
    srFs.turnPtr++;
    srBcast();
    setTimeout(()=>srProcessTurn(), 800);
    return;
  }
  // Random card forced (magic 3/4)
  if(srFs.randomPlayers.includes(currentId)){
    const idx = Math.floor(Math.random()*currentPlayer.hand.length);
    const card = currentPlayer.hand.splice(idx,1)[0];
    srFs.playedCards.push({playerId:currentId, type:card.type, cardId:card.id});
    srFs.pendingActions.push({playerId:currentId, action:'play'});
    if(currentId === myId){ srMyCards = currentPlayer.hand.map(c=>({id:c.id,type:c.type})); }
    else if(!currentPlayer.isCpu){ fbSendTo(currentId, {type:'sr_private', cards:currentPlayer.hand.map(c=>({id:c.id,type:c.type}))}); }
    srFs.log.push(`🎲 ${currentPlayer.name} がランダムに1枚伏せた`);
    srFs.turnPtr++;
    srBcast();
    setTimeout(()=>srProcessTurn(), 800);
    return;
  }
  // Synced pair: if first acted, this one mirrors
  const syncedFor = srFs.syncedPairs.find(pair=>pair[1]===currentId);
  if(syncedFor){
    const firstAction = srFs.pendingActions.find(a=>a.playerId===syncedFor[0]);
    if(firstAction){
      if(firstAction.action==='pass'){
        srFs.log.push(`🔁 効果5: ${currentPlayer.name} はパス（${srFs.players.find(pp=>pp.id===syncedFor[0])?.name}に同期）`);
        srFs.pendingActions.push({playerId:currentId, action:'pass'});
        srFs.turnPtr++;
        srBcast();
        setTimeout(()=>srProcessTurn(), 800);
        return;
      } else {
        // Aが出した場合、Bも出す。ただしBに手札がなければパス
        if(currentPlayer.hand.length === 0){
          srFs.log.push(`🔁 効果5: ${currentPlayer.name} は手札なしのためパス（${srFs.players.find(pp=>pp.id===syncedFor[0])?.name}に同期不可）`);
          srFs.pendingActions.push({playerId:currentId, action:'pass'});
          srFs.turnPtr++;
          srBcast();
          setTimeout(()=>srProcessTurn(), 800);
          return;
        }
        const idx = Math.floor(Math.random()*currentPlayer.hand.length);
        const card = currentPlayer.hand.splice(idx,1)[0];
        srFs.playedCards.push({playerId:currentId, type:card.type, cardId:card.id});
        srFs.pendingActions.push({playerId:currentId, action:'play'});
        if(currentId === myId){ srMyCards = currentPlayer.hand.map(c=>({id:c.id,type:c.type})); }
        else if(!currentPlayer.isCpu){ fbSendTo(currentId, {type:'sr_private', cards:currentPlayer.hand.map(c=>({id:c.id,type:c.type}))}); }
        srFs.log.push(`🔁 効果5: ${currentPlayer.name} がランダムに1枚伏せた（${srFs.players.find(pp=>pp.id===syncedFor[0])?.name}に同期）`);
        srFs.turnPtr++;
        srBcast();
        setTimeout(()=>srProcessTurn(), 800);
        return;
      }
    }
  }
  srBcast();
  // CPU
  if(currentPlayer.isCpu){
    setTimeout(()=>srCpuTakeTurn(currentPlayer), 1200);
  }
}

function srSubmitPlayCard(cardId){
  if(!isHost){ fbSendToHost({type:'sr_action_play_card', cardId}); return; }
  srHostPlayCard(myId, cardId);
}
function srSubmitPass(){
  if(!isHost){ fbSendToHost({type:'sr_action_pass'}); return; }
  srHostPass(myId);
}

function srHostPlayCard(actorId, cardId){
  if(srFs.phase !== 'phase2') return;
  const currentId = srFs.turnOrder[srFs.turnPtr];
  if(currentId !== actorId) return;
  const player = srFs.players.find(p=>p.id===actorId);
  const idx = player.hand.findIndex(c=>c.id===cardId);
  if(idx<0) return;
  const card = player.hand.splice(idx,1)[0];
  srFs.playedCards.push({playerId:actorId, type:card.type, cardId:card.id});
  srFs.pendingActions.push({playerId:actorId, action:'play'});
  if(actorId === myId){ srMyCards = player.hand.map(c=>({id:c.id,type:c.type})); }
  else if(!player.isCpu){ fbSendTo(actorId, {type:'sr_private', cards:player.hand.map(c=>({id:c.id,type:c.type}))}); }
  srFs.log.push(`🃏 ${player.name} がカードを1枚伏せた`);
  srFs.turnPtr++;
  srBcast();
  setTimeout(()=>srProcessTurn(), 800);
}

function srHostPass(actorId){
  if(srFs.phase !== 'phase2') return;
  const currentId = srFs.turnOrder[srFs.turnPtr];
  if(currentId !== actorId) return;
  // Check if forced
  if(srFs.forcedPlayers.includes(actorId)){
    // Forced - can't pass; ignore
    return;
  }
  const player = srFs.players.find(p=>p.id===actorId);
  srFs.pendingActions.push({playerId:actorId, action:'pass'});
  srFs.log.push(`⏭ ${player.name} はパス`);
  srFs.turnPtr++;
  srBcast();
  setTimeout(()=>srProcessTurn(), 800);
}

// ============================================================
// PHASE 3: REVEAL & PLACEMENT
// ============================================================
function srGoToPhase3(){
  srFs.phase = 'phase3';
  srFs.turnIdx = null;
  // 効果10: フェイズ2終了後、holderが対象を選ぶ（任意効果）
  if(srFs.magic10Pending){
    const holderId = srFs.magic10HolderId;
    // 対象候補: カードを出した && 手札を1枚以上持つ プレイヤー（他プレイヤー）
    const playedIds = srFs.playedCards.map(pc=>pc.playerId);
    const candidates = srFs.players.filter(p=>
      p.id !== holderId &&
      playedIds.includes(p.id) &&
      (p.hand||[]).length > 0
    );
    if(candidates.length === 0){
      srFs.log.push(`🔄 効果10: 対象可能なプレイヤーがいないため不発`);
      srFs.magic10Pending = false;
      srFs.magic10HolderId = null;
      srDoReveal();
      return;
    }
    // holderに「指定する/しない」を選ばせる
    srFs.targetPickerId = holderId;
    srFs.targetPickerMagic = 10;
    srFs.targetPickerCount = 1;
    srFs.targetCandidateIds = candidates.map(p=>p.id);
    srFs.magic10Pending = false;
    srBcast();
    if(isSolo && srFs.players.find(p=>p.id===holderId)?.isCpu){
      setTimeout(()=>{
        // CPU: 50%でスキップ、50%でランダム指定
        if(Math.random() < 0.5 || candidates.length === 0){
          srHostMagic10Pick(holderId, null);
        } else {
          const t = candidates[Math.floor(Math.random()*candidates.length)];
          srHostMagic10Pick(holderId, t.id);
        }
      }, 1500);
    }
    return;
  }
  srDoReveal();
}

// 効果10: holderが対象を選ぶ（または不発を選ぶ）
function srHostMagic10Pick(actorId, targetId){
  if(srFs.targetPickerMagic !== 10) return;
  if(srFs.targetPickerId !== actorId) return;
  srFs.targetPickerId = null;
  srFs.targetPickerMagic = null;
  srFs.targetPickerCount = 0;
  srFs.targetCandidateIds = null;
  srFs.magic10HolderId = null;
  if(!targetId){
    srFs.log.push(`🔄 効果10: 指定をスキップ`);
    srBcast();
    setTimeout(()=>srDoReveal(), 1000);
    return;
  }
  const target = srFs.players.find(p=>p.id===targetId);
  const playedCard = srFs.playedCards.find(pc=>pc.playerId===targetId);
  if(!target || !playedCard || (target.hand||[]).length === 0){
    srFs.log.push(`🔄 効果10: 対象が不適切なためスキップ`);
    srBcast();
    setTimeout(()=>srDoReveal(), 1000);
    return;
  }
  // 対象本人が「どのカードに差し替えるか」を選ぶ
  srFs.swapPending = {
    targetId: targetId,
    originalCardId: playedCard.cardId
  };
  srFs.log.push(`🔄 効果10: ${target.name} はカードを差し替える対象に指定された`);
  srBcast();
  if(target.isCpu){
    setTimeout(()=>{
      // CPU は手札からランダムに選ぶ
      const newCardId = target.hand[Math.floor(Math.random()*target.hand.length)].id;
      srHostPickReplace(targetId, newCardId);
    }, 1500);
  }
}

function srHostPickReplace(actorId, newCardId){
  if(!srFs.swapPending) return;
  // 差し替えカードを選ぶのは「対象本人」
  if(actorId !== srFs.swapPending.targetId) return;
  const target = srFs.players.find(p=>p.id===actorId);
  if(!target) return;
  if(newCardId){
    // Swap: put original back into hand, take new card to playedCards
    const playedIdx = srFs.playedCards.findIndex(pc=>pc.cardId===srFs.swapPending.originalCardId);
    if(playedIdx>=0){
      const originalCard = srFs.playedCards[playedIdx];
      const newCardIdxInHand = target.hand.findIndex(c=>c.id===newCardId);
      if(newCardIdxInHand>=0){
        const newCard = target.hand[newCardIdxInHand];
        // Put original card back into hand
        target.hand.push({id:originalCard.cardId, type:originalCard.type});
        // Remove new card from hand
        target.hand.splice(newCardIdxInHand,1);
        // Update played
        srFs.playedCards[playedIdx] = {playerId:target.id, type:newCard.type, cardId:newCard.id};
        if(target.id === myId){ srMyCards = target.hand.map(c=>({id:c.id,type:c.type})); }
        else if(!target.isCpu){ fbSendTo(target.id, {type:'sr_private', cards:target.hand.map(c=>({id:c.id,type:c.type}))}); }
        srFs.log.push(`🔄 効果10: ${target.name} がカードを差し替えた`);
      }
    }
  } else {
    srFs.log.push(`🔄 効果10: カード差し替えはスキップされた`);
  }
  srFs.swapPending = null;
  srBcast();
  setTimeout(()=>srDoReveal(), 1000);
}

function srDoReveal(){
  // Shuffle played cards (unless magic 2 active)
  let cards = srFs.playedCards.slice();
  if(!srFs.noShuffleAtReveal){
    cards = shuffle(cards);
  }
  srFs.revealedCards = cards;
  srFs.revealMode = true;
  srFs.noShuffleAtReveal = false;
  // Categorize
  const bloodCards = cards.filter(c=>['greatSword','doubleKnife','darkKnife'].includes(c.type));
  const whiteRoseCard = cards.find(c=>c.type==='whiteRose');
  const budCards = cards.filter(c=>['bishop','believer'].includes(c.type));
  const ghostCards = cards.filter(c=>c.type==='ghost');
  let immediateEnd = false;
  if(bloodCards.length>0 && whiteRoseCard){
    // Blood blade kills white rose - immediate win
    srFs.board.bloodBlade.push(...bloodCards);
    srFs.board.dead.push(...budCards, whiteRoseCard); // white rose dies with the bud cards
    srFs.board.ghostSide.push(...ghostCards);
    srFs.winner = 'blood';
    srFs.winReason = `血刃陣営が<白薔薇>を殺害しました！`;
    srFs.phase = 'result';
    srFs.log.push(`💀 ${srFs.winReason}`);
    immediateEnd = true;
  } else if(bloodCards.length>0){
    // Blood blade wins this round - 蕾 go to death
    srFs.board.bloodBlade.push(...bloodCards);
    srFs.board.dead.push(...budCards);
    srFs.board.ghostSide.push(...ghostCards);
    srFs.log.push(`💀 血刃陣営が出現 → 蕾カードは死亡枠へ`);
  } else if(whiteRoseCard){
    // White rose survives - placed on rose slot, 蕾 to sacrifice
    srFs.board.whiteRose = whiteRoseCard;
    srFs.board.sacrifice.push(...budCards);
    srFs.board.ghostSide.push(...ghostCards);
    srFs.log.push(`🌹 白薔薇が出現 → 蕾カードは生贄枠へ`);
  } else {
    // Only bud/ghost cards
    srFs.board.sacrifice.push(...budCards);
    srFs.board.ghostSide.push(...ghostCards);
    if(budCards.length>0) srFs.log.push(`🙏 蕾カードのみ → 生贄枠へ`);
  }
  srBcast();
  // Check win conditions
  setTimeout(()=>{
    if(immediateEnd){
      srBcast();
      if(!isSolo) fbBroadcast({type:'sr_result'});
      srShowResult();
      return;
    }
    srCheckWinAndAdvance();
  }, 3500);
}

function srCheckWinAndAdvance(){
  // 蕾カウント = 司教 + 信者のみ（白薔薇は含めない）
  const sacrificeBud = srFs.board.sacrifice.filter(c=>['bishop','believer'].includes(c.type)).length;
  const deadBud = srFs.board.dead.filter(c=>['bishop','believer'].includes(c.type)).length;
  const whiteRoseAlive = !!srFs.board.whiteRose;
  const needRose = srFs.winBudRose != null ? srFs.winBudRose : srFs.winBud;
  const needBlood = srFs.winBudBlood != null ? srFs.winBudBlood : srFs.winBud;
  // White rose victory
  if(whiteRoseAlive && sacrificeBud >= needRose){
    srFs.winner = 'rose';
    srFs.winReason = `白薔薇の生存が確定し、規定数の蕾（${sacrificeBud}/${needRose}）が生贄に捧げられました！`;
    srFs.phase = 'result';
    srBcast();
    if(!isSolo) fbBroadcast({type:'sr_result'});
    srShowResult();
    return;
  }
  // Blood blade victory by deaths
  if(deadBud >= needBlood){
    srFs.winner = 'blood';
    srFs.winReason = `規定数の蕾（${deadBud}/${needBlood}）が死亡しました！`;
    srFs.phase = 'result';
    srBcast();
    if(!isSolo) fbBroadcast({type:'sr_result'});
    srShowResult();
    return;
  }
  // All chips placed? (=プレイヤー数と同じだけのチップが置かれたら最終評価)
  if(srFs.chipsPlaced.length >= srFs.players.length){
    // Final eval
    let totalBudInHand = 0;
    let whiteRoseInHand = false;
    srFs.players.forEach(p=>{
      if(p.role && SR_ROLES[p.role].team==='rose'){
        (p.hand||[]).forEach(c=>{
          if(c.type==='whiteRose') whiteRoseInHand = true;
          if(['bishop','believer'].includes(c.type)) totalBudInHand++;
        });
      }
    });
    if(!whiteRoseInHand && totalBudInHand===0){
      srFs.winner = 'rose';
      srFs.winReason = `水晶チップが置き切られ、白薔薇陣営の手札に蕾と白薔薇が残っていない！`;
    } else {
      srFs.winner = 'blood';
      srFs.winReason = `水晶チップが置き切られ、白薔薇陣営に蕾または白薔薇が残った！`;
    }
    srFs.phase = 'result';
    srBcast();
    if(!isSolo) fbBroadcast({type:'sr_result'});
    srShowResult();
    return;
  }
  // Next round
  srFs.round++;
  srFs.replaceTargetId = null;
  srFs.swapPending = null;
  srStartRound();
}

function srCpuCoinPass(){
  if(!isSolo || srFs.phase !== 'phase1') return;
  const holder = srFs.players[srFs.coinIdx];
  if(!holder || !holder.isCpu) return;
  // Pick a random player with chip
  const candidates = srFs.players.filter(p=>p.id !== holder.id && p.chip != null);
  if(candidates.length===0) return;
  const target = candidates[Math.floor(Math.random()*candidates.length)];
  srHostCoinPass(holder.id, target.id);
}

function srCpuPickMagicTarget(){
  if(!isSolo || !srFs.targetPickerId) return;
  const picker = srFs.players.find(p=>p.id===srFs.targetPickerId);
  if(!picker || !picker.isCpu) return;
  const magic = srFs.targetPickerMagic;
  // 効果10は別関数
  if(magic === 10){
    // CPUは50%の確率で対象指定 / 50%スキップ
    const candidates = (srFs.targetCandidateIds||[])
      .map(id=>srFs.players.find(p=>p.id===id))
      .filter(p=>p);
    if(candidates.length === 0 || Math.random() < 0.5){
      srHostMagic10Pick(picker.id, null);
    } else {
      const t = candidates[Math.floor(Math.random()*candidates.length)];
      srHostMagic10Pick(picker.id, t.id);
    }
    return;
  }
  // 候補からランダム選択
  const candidateIds = srFs.targetCandidateIds || [];
  let targets = [];
  if(magic === 5){
    const shuffled = shuffle(candidateIds.slice());
    targets = shuffled.slice(0, 2);
    if(targets.length < 2) targets = [];
  } else {
    if(candidateIds.length > 0){
      targets = [candidateIds[Math.floor(Math.random()*candidateIds.length)]];
    }
  }
  if(targets.length > 0) srHostMagicTarget(picker.id, targets);
  else {
    // Skip
    srFs.targetPickerId = null;
    srFs.targetPickerMagic = null;
    srFs.targetPickerCount = 0;
    srFs.targetCandidateIds = null;
    srFs.log.push(`🚫 効果${magic}: 対象不在のためスキップ`);
    srBcast();
    setTimeout(()=>srProceedToPhase2(srFs.players[srFs.coinIdx].id), 800);
  }
}

function srCpuTakeTurn(player){
  if(!isSolo || srFs.phase !== 'phase2') return;
  if(player.id !== srFs.turnOrder[srFs.turnPtr]) return;
  if(!player.hand || player.hand.length===0){ srHostPass(player.id); return; }
  const forced = srFs.forcedPlayers.includes(player.id);
  const myTeam = SR_ROLES[player.role].team;
  // Simple AI: 
  //   - If forced, must play
  //   - Else strategic: blood team plays blood/ghost; rose team plays believer/ghost
  let willPlay = forced || Math.random() < 0.65;
  if(!willPlay){ srHostPass(player.id); return; }
  let cardToPlay = null;
  if(myTeam === 'blood'){
    // Prefer playing blood role cards (to win)
    cardToPlay = player.hand.find(c=>['greatSword','doubleKnife','darkKnife'].includes(c.type))
             || player.hand.find(c=>c.type==='ghost')
             || player.hand.find(c=>c.type==='believer')
             || player.hand[0];
  } else {
    // Rose team: prefer believer (bud) to sacrifice OR ghost (no harm)
    cardToPlay = player.hand.find(c=>c.type==='believer')
             || player.hand.find(c=>c.type==='ghost')
             || player.hand.find(c=>c.type==='bishop')
             || player.hand[0];
    // Almost never play white rose unless very confident (low chance)
    if(cardToPlay && cardToPlay.type==='whiteRose' && Math.random()>0.1){
      const alt = player.hand.find(c=>c.type!=='whiteRose');
      if(alt) cardToPlay = alt;
    }
  }
  srHostPlayCard(player.id, cardToPlay.id);
}

function srGetCurrentDist(){
  // カスタムがあればそれ、なければデフォルト
  const n = srGs?.players?.length || srFs?.players?.length || 5;
  if(srCustomDist) return srCustomDist;
  const def = srGetDistForN(n) || srGetDistForN(5);
  return {...def};
}

function srResetRoleDist(){
  srCustomDist = null;
  srRenderRoleCustom();
}

function srValidateRoleDist(){
  if(!srGs) return false;
  const dist = srGetCurrentDist();
  const n = srGs.players.length;
  let total = 0;
  Object.keys(dist).forEach(k=>{
    if(k==='winBud') return;
    total += dist[k];
  });
  return total === n && dist.whiteRose === 1; // 白薔薇は必ず1枚
}

function srRenderRoleCustom(){
  const body = g('role-custom-body');
  if(!body) return;
  const dist = srGetCurrentDist();
  const n = srGs?.players?.length || 5;
  let total = 0;
  const items = [
    {key:'whiteRose', label:'🌹 白薔薇', team:'rose', desc:'(必須1枚)'},
    {key:'bishop',    label:'⛪ 司教',   team:'rose', desc:'(蕾)'},
    {key:'believer',  label:'🙏 信者',   team:'rose', desc:'(蕾)'},
    {key:'greatSword',label:'⚔️ 巨刃',   team:'blood', desc:''},
    {key:'doubleKnife',label:'🗡️ 双刃',  team:'blood', desc:'(必須1枚推奨)'},
    {key:'darkKnife', label:'🔪 暗刃',   team:'blood', desc:''},
  ];
  let html = '';
  items.forEach(it=>{
    const count = dist[it.key] || 0;
    total += count;
    const teamColor = it.team==='rose'?'var(--rose)':'var(--blood-bright)';
    const isLocked = it.key==='whiteRose'; // 白薔薇は固定
    html += `<div style="display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--surface); border:1px solid var(--surface3); border-radius:6px;">
      <span style="flex:1; color:${teamColor}; font-size:0.85rem;">${it.label} <span style="color:var(--muted); font-size:0.7rem;">${it.desc}</span></span>
      <button class="count-btn" style="width:32px; height:32px; ${isLocked?'opacity:0.3;':''}" ${isLocked?'disabled':''} onclick="srChangeRoleCount('${it.key}', -1)">−</button>
      <span style="min-width:24px; text-align:center; font-family:var(--mono); font-size:1.1rem; color:var(--gold);">${count}</span>
      <button class="count-btn" style="width:32px; height:32px; ${isLocked?'opacity:0.3;':''}" ${isLocked?'disabled':''} onclick="srChangeRoleCount('${it.key}', 1)">+</button>
    </div>`;
  });
  body.innerHTML = html;
  // ステータス
  const status = g('role-custom-status');
  const roseCount = (dist.whiteRose||0) + (dist.bishop||0) + (dist.believer||0);
  const bloodCount = (dist.greatSword||0) + (dist.doubleKnife||0) + (dist.darkKnife||0);
  const budTotal = (dist.bishop||0) + (dist.believer||0);
  const winRose = dist.winBudRose != null ? dist.winBudRose : (dist.winBud || Math.max(2, Math.ceil(budTotal/2)));
  const winBlood = dist.winBudBlood != null ? dist.winBudBlood : (dist.winBud || Math.max(2, Math.ceil(budTotal/2)));
  if(total === n){
    status.style.color = 'var(--green)';
    status.innerHTML = `✅ 合計 ${total}/${n}人（🌹白薔薇陣営 ${roseCount}人、🗡️血刃陣営 ${bloodCount}人）<br>
      <span style="color:var(--rose); font-size:0.72rem;">🌹勝利: 蕾 ${winRose}枚 生贄</span>　
      <span style="color:var(--blood-bright); font-size:0.72rem;">🗡️勝利: 蕾 ${winBlood}枚 殺害</span>`;
  } else if(total < n){
    status.style.color = 'var(--amber)';
    status.innerHTML = `⚠️ あと ${n-total}枚追加が必要（現在 ${total}/${n}）`;
  } else {
    status.style.color = 'var(--red)';
    status.innerHTML = `❌ ${total-n}枚減らしてください（現在 ${total}/${n}）`;
  }
}

function srChangeRoleCount(key, delta){
  if(!srCustomDist) srCustomDist = srGetCurrentDist();
  const cur = srCustomDist[key] || 0;
  const next = cur + delta;
  if(next < 0) return;
  // 役職別上限（自由にしすぎないように）
  if(next > 5) return;
  srCustomDist[key] = next;
  // winBud は蕾合計に応じて自動算出（蕾の半分以上を勝利数とする）
  const budTotal = (srCustomDist.bishop||0) + (srCustomDist.believer||0);
  const need = Math.max(2, Math.ceil(budTotal / 2));
  srCustomDist.winBudRose = need;
  srCustomDist.winBudBlood = need;
  srCustomDist.winBud = need; // 旧互換
  srRenderRoleCustom();
  // ホストがカスタム時、他のプレイヤーにも変更を通知（待機画面のみ）
  if(isHost && srFs && srFs.phase==='waiting'){
    srBcast();
  }
}

// ROUND TABLE (円卓)
// ============================================================
function srRenderTable(){
  const container = g('game-table-container');
  if(!container) return;
  const players = srGs.players;
  const n = players.length;
  // 自分が下に来るように回転
  const myIdx = players.findIndex(p=>p.id===myId);
  const rotateOffset = myIdx >= 0 ? myIdx : 0;
  let html = '<div class="round-table">';
  // Center
  const phaseLabel = {phase1:'P1: コイン', phase2:'P2: 手番', phase3:'P3: 公開'}[srGs.phase] || '';
  html += `<div class="table-center">
    <div class="round-num">R${srGs.round}</div>
    <div class="phase-info">${phaseLabel}</div>
  </div>`;
  // Seats around circle
  players.forEach((p, idx)=>{
    // 自分を真下（angle = π/2 = 90deg）に配置
    const relIdx = (idx - rotateOffset + n) % n;
    const angle = (Math.PI / 2) + (2 * Math.PI * relIdx / n) + Math.PI; // 真下からスタート、時計回り
    // Position on circle (radius 40% of container - 座席は外側に配置)
    const radius = 40;
    const cx = 50 + radius * Math.cos(angle);
    const cy = 50 + radius * Math.sin(angle);
    const isMe = p.id === myId;
    const isCoin = p.id === srGs.coinHolderId;
    const isTurn = srGs.phase === 'phase2' && p.id === srGs.turnPlayerId;
    const isStart = (srGs.phase === 'phase1' && p.id === srGs.phase1StartId) ||
                    (srGs.phase === 'phase2' && p.id === srGs.phase2StartId) ||
                    (srGs.phase === 'phase3' && p.id === srGs.phase2StartId);
    const isNightSeen = srMyNightSeen.includes(p.id);
    const isMagic9Seen = srMyMagic9Seen.includes(p.id);
    // フェイズ2のアクション状態
    let actionStatus = '';
    let actionLabel = '';
    if(srGs.phase === 'phase2'){
      const action = (srGs.pendingActions||[]).find(a=>a.playerId===p.id);
      if(action){
        if(action.action === 'play'){ actionStatus = 'played'; actionLabel = '🃏 出した'; }
        else if(action.action === 'pass'){ actionStatus = 'passed'; actionLabel = '⏭ パス'; }
      } else if(p.id === srGs.turnPlayerId){
        actionStatus = 'acting'; actionLabel = '▶ 思考中';
      } else if((srGs.turnOrder||[]).includes(p.id)){
        // まだ手番が来ていない
        const myPtr = (srGs.turnOrder||[]).indexOf(p.id);
        const curPtr = srGs.turnPtr;
        if(curPtr != null && myPtr > curPtr){
          actionStatus = 'waiting'; actionLabel = '待機中';
        }
      }
    }
    const classes = ['seat'];
    if(isMe) classes.push('is-me');
    if(isCoin) classes.push('is-coin');
    if(isTurn) classes.push('is-turn');
    if(isStart) classes.push('is-start');
    if(isNightSeen && !isMe) classes.push('night-seen');
    if(isMagic9Seen && !isMe) classes.push('magic9-seen');
    const marks = [];
    if(isCoin) marks.push('🪙');
    if(isNightSeen && !isMe) marks.push('👁');
    if(isMagic9Seen && !isMe) marks.push('🔪');
    const marksStr = marks.join('');
    html += `<div class="${classes.join(' ')}" style="left:${cx}%; top:${cy}%;">
      <div class="seat-avatar">${marksStr || p.name[0].toUpperCase()}
        ${p.handCount!=null ? `<div class="seat-handcount">${p.handCount}${p.hasChip?'⬡':''}</div>` : ''}
      </div>
      <div class="seat-name">${p.name}${isMe?' (あなた)':''}</div>
      ${actionLabel ? `<div class="seat-status ${actionStatus}">${actionLabel}</div>` : ''}
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function srRenderProgressInfo(){
  const el = g('game-progress-info');
  if(!el) return;
  const html = [];
  // フェイズ別スタートプレイヤー
  if(srGs.phase === 'phase1' && srGs.phase1StartId){
    const sp = srGs.players.find(p=>p.id===srGs.phase1StartId);
    html.push(`<div style="display:flex; align-items:center; gap:8px;">
      <span class="label">▶ P1 スタート</span>
      <span class="value">🪙 ${sp?.name||'?'}</span>
    </div>`);
  }
  if(['phase2','phase3'].includes(srGs.phase) && srGs.phase2StartId){
    const sp = srGs.players.find(p=>p.id===srGs.phase2StartId);
    const p1sp = srGs.players.find(p=>p.id===srGs.phase1StartId);
    html.push(`<div style="display:flex; flex-direction:column; gap:4px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="label">▶ P1 スタート</span>
        <span class="value" style="font-size:0.82rem;">🪙 ${p1sp?.name||'?'}</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="label">▶ P2 スタート</span>
        <span class="value" style="font-size:0.82rem;">▶ ${sp?.name||'?'}</span>
      </div>
    </div>`);
  }
  // フェイズ2の進捗状況
  if(srGs.phase === 'phase2' && srGs.turnOrder && srGs.turnOrder.length > 0){
    const played = (srGs.pendingActions||[]).filter(a=>a.action==='play').length;
    const passed = (srGs.pendingActions||[]).filter(a=>a.action==='pass').length;
    const remaining = srGs.turnOrder.length - (srGs.turnPtr||0);
    html.push(`<div style="padding-top:6px; border-top:1px dashed var(--surface3); display:flex; gap:8px; flex-wrap:wrap; font-size:0.78rem;">
      <span><span style="color:var(--green);">🃏 出した:</span> ${played}人</span>
      <span><span style="color:var(--muted);">⏭ パス:</span> ${passed}人</span>
      <span><span style="color:var(--amber);">残り:</span> ${remaining}人</span>
    </div>`);
  }
  if(html.length === 0){
    el.style.display = 'none';
    el.innerHTML = '';
  } else {
    el.style.display = '';
    el.className = 'progress-info';
    el.innerHTML = html.join('');
  }
}

function srRenderBoard(){
  const board = g('game-board');
  const b = srGs.board;
  let html = '<div class="board-top">';
  // White rose slot
  html += `<div class="board-slot rose"><div class="label">白薔薇枠</div><div class="cards">${b.whiteRose?srCardHtml(b.whiteRose, true):'<div style="color:var(--muted); font-size:0.7rem;">空</div>'}</div></div>`;
  // Blood blade slot
  html += `<div class="board-slot blood"><div class="label">血刃枠 (${b.bloodBlade.length})</div><div class="cards">${b.bloodBlade.map(c=>srCardHtml(c,true)).join('')}</div></div>`;
  html += '</div>';
  // Crystal chip slots (プレイヤー数分)
  const totalChipSlots = srGs.playerCount || 5;
  html += '<div class="chip-row" style="flex-wrap:wrap; justify-content:center;">';
  for(let i=1; i<=totalChipSlots; i++){
    const placed = srGs.chipsPlaced.find(c=>c.slotIdx===i);
    html += `<div class="chip-slot ${placed?'filled':''}">${placed?placed.chipNumber:i}</div>`;
  }
  html += '</div>';
  // 配置順ラベル
  html += `<div style="text-align:center; font-size:0.7rem; color:var(--muted); font-family:var(--mono); margin-top:2px;">水晶チップ配置順 (${srGs.chipsPlaced.length}/${totalChipSlots})</div>`;
  // Sacrifice / Death / Ghost row
  html += '<div class="board-top">';
  // 蕾カウント（白薔薇は含めない）
  const sacrificeBudCount = b.sacrifice.filter(c=>['bishop','believer'].includes(c.type)).length;
  const deadBudCount = b.dead.filter(c=>['bishop','believer'].includes(c.type)).length;
  html += `<div class="board-slot sacrifice"><div class="label">生贄枠 蕾(${sacrificeBudCount}/${srGs.winBudRose||srGs.winBud})</div><div class="cards">${b.sacrifice.map(c=>srCardHtml(c,true)).join('')}</div></div>`;
  html += `<div class="board-slot death"><div class="label">死亡枠 蕾(${deadBudCount}/${srGs.winBudBlood||srGs.winBud})</div><div class="cards">${b.dead.map(c=>srCardHtml(c,true)).join('')}</div></div>`;
  html += `<div class="board-slot ghost-side"><div class="label">幽魂 (${b.ghostSide.length})</div><div class="cards">${b.ghostSide.map(()=>srCardHtml({type:'ghost'},true)).join('')}</div></div>`;
  html += '</div>';
  board.innerHTML = html;
  // 夜情報の専用パネルをボードの上に固定表示
  srRenderNightInfoPanel();
}
