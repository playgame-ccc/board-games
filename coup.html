<!-- COUP v1 -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎩 クー Coup</title>
<style>
:root {
  --bg: #100c14;
  --surface: #1b1622;
  --surface2: #241d2e;
  --surface3: #3a3048;
  --text: #f3eff7;
  --muted: #9a90a8;
  --red: #ff5566;
  --green: #35e08c;
  --blue: #4db8ff;
  --gold: #e8c46a;
  --coup: #c9433f;
  --coup-dim: rgba(201,67,63,0.16);
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
  --mono: "SF Mono", Menlo, Monaco, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
  overscroll-behavior: none; padding-bottom: env(safe-area-inset-bottom);
}
.app { max-width: 480px; margin: 0 auto; padding: 12px; min-height: 100dvh; display: flex; flex-direction: column; gap: 10px; }
body.ingame { overflow: hidden; height: 100dvh; }
body.ingame .app { height: 100dvh; min-height: 0; }
.screen { display: none; flex-direction: column; gap: 10px; }
.screen.active { display: flex; }
h1 { font-size: 1.8rem; text-align: center; }
h2 { font-size: 1.3rem; text-align: center; }
h3 { font-size: 0.78rem; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 11px 16px; border-radius: 10px; border: 1px solid var(--surface3);
  background: var(--surface); color: var(--text); cursor: pointer;
  font-family: var(--sans); font-size: 0.92rem; font-weight: 600; transition: all 0.15s; user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.32; cursor: not-allowed; }
.btn-coup { background: var(--coup); border-color: var(--coup); color: #fff; }
.btn-blue { background: rgba(77,184,255,0.15); border-color: rgba(77,184,255,0.5); color: var(--blue); }
.btn-green { background: rgba(53,224,140,0.14); border-color: rgba(53,224,140,0.5); color: var(--green); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 10px; font-size: 0.76rem; border-radius: 8px; }
.input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--surface3); background: var(--surface2); color: var(--text);
  font-size: 1rem; font-family: var(--sans); outline: none;
}
.input:focus { border-color: var(--coup); }
.code-input { font-family: var(--mono); font-size: 1.3rem; text-align: center; letter-spacing: 6px; }
.row { display: flex; gap: 8px; align-items: center; }
.divider { height: 1px; background: var(--surface3); margin: 4px 0; }
.panel { background: var(--surface); border: 1px solid var(--surface3); border-radius: 12px; padding: 12px; }
.status-txt { text-align: center; font-size: 0.85rem; color: var(--blue); min-height: 1.2em; }
.error { text-align: center; font-size: 0.85rem; color: var(--red); min-height: 1.2em; }
.code-box { text-align: center; background: var(--surface); border: 1px dashed var(--surface3); border-radius: 12px; padding: 10px; }
.code-box .label { font-size: 0.7rem; color: var(--muted); font-family: var(--mono); letter-spacing: 2px; }
.code-box .code { font-size: 2rem; font-family: var(--mono); letter-spacing: 8px; color: var(--gold); font-weight: 700; }
.player-list { display: flex; flex-direction: column; gap: 6px; }
.player-chip { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: 10px; padding: 9px 12px; font-size: 0.92rem; }
.log { font-size: 0.72rem; color: var(--muted); overflow-y: auto; line-height: 1.6; font-family: var(--mono); }
.log div { border-bottom: 1px solid rgba(255,255,255,0.04); padding: 2px 0; }
.tag { font-size: 0.64rem; color: var(--muted); font-family: var(--mono); }

/* ===== キャラカード ===== */
.ccard {
  width: 62px; height: 84px; border-radius: 8px; border: 2px solid var(--surface3);
  background: var(--surface2); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; user-select: none; flex: 0 0 auto;
  position: relative; overflow: hidden;
}
.ccard .ce { font-size: 1.5rem; line-height: 1; }
.ccard .cn { font-size: 0.66rem; font-weight: 800; }
.ccard.dead { opacity: 0.4; filter: grayscale(1); border-style: dashed; }
.ccard.dead::after { content: '除外'; position: absolute; bottom: 2px; font-size: 0.52rem; color: var(--red); font-weight: 800; }
.ccard.back { background: repeating-linear-gradient(135deg,#2b2338 0 7px,#221b2e 7px 14px); color: rgba(255,255,255,0.3); }
.ccard.pick { outline: 2px solid var(--coup); outline-offset: 2px; transform: translateY(-4px); }
.ccard.sel { border-color: var(--green); box-shadow: 0 0 8px rgba(53,224,140,0.5); }
.cards-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* ===== ゲーム画面 ===== */
#screen-game { height: 100%; gap: 6px; overflow: hidden; }
#screen-game > * { flex-shrink: 0; }
#screen-game > #panel-log { flex-shrink: 1; }
#screen-game .panel { padding: 7px 9px; }
#screen-game h3 { margin-bottom: 5px !important; font-size: 0.66rem; }
.turnbar { text-align: center; padding: 6px; border-radius: 10px; font-weight: 700; font-size: 0.86rem; background: var(--surface); border: 1px solid var(--surface3); }
.turnbar.me { background: var(--coup-dim); border-color: var(--coup); color: #ff8a86; animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(201,67,63,0.4);} 50%{ box-shadow: 0 0 0 7px rgba(201,67,63,0);} }
.hdr { display: block; font-size: 0.66rem; font-family: var(--mono); color: var(--muted);
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr b { color: var(--gold); }
.prow { display: flex; align-items: center; gap: 6px; background: var(--surface2); border-radius: 9px; padding: 4px 7px; border: 1px solid transparent; font-size: 0.8rem; }
.prow.turn { border-color: var(--coup); background: var(--coup-dim); }
.prow.out { opacity: 0.45; }
.prow .pname { min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inf { display: inline-flex; gap: 3px; }
.dot { width: 11px; height: 15px; border-radius: 3px; background: #4a3f5c; display: inline-block; }
.dot.dead { background: transparent; border: 1px dashed #6b5f7d; }
.mini { font-size: 0.6rem; padding: 0 3px; border-radius: 3px; background: var(--surface3); }
.coins { font-family: var(--mono); font-size: 0.76rem; color: var(--gold); white-space: nowrap; }
.acts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
.acts .btn { padding: 8px 4px; font-size: 0.8rem; }
.acts .btn .sub { font-size: 0.62rem; opacity: 0.7; margin-left: 3px; }
.claim { display: inline-block; font-size: 0.62rem; padding: 1px 5px; border-radius: 5px; font-weight: 700; }
.msg { text-align: center; font-size: 0.8rem; font-weight: 700; line-height: 1.35; }
.sub { text-align: center; font-size: 0.68rem; color: var(--muted); line-height: 1.3; }
#panel-log { flex: 1 1 0; min-height: 40px; display: flex; flex-direction: column; overflow: hidden; }
#panel-log .log { flex: 1 1 0; min-height: 0; }
.btn-exit { padding: 3px 9px; font-size: 0.7rem; border-radius: 7px; }
.seg { display: flex; gap: 5px; }
.seg .btn { flex: 1; padding: 8px 2px; font-size: 0.82rem; }
.seg .btn.on { background: var(--coup-dim); border-color: var(--coup); color: #ff8a86; }

.result-hero { text-align: center; padding: 18px 10px; }
.result-emoji { font-size: 3rem; }
.result-title { font-size: 1.4rem; font-weight: 800; margin-top: 6px; }
.result-sub { font-size: 0.88rem; color: var(--muted); margin-top: 4px; }

.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 500; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--surface3); border-radius: 14px; padding: 16px; width: 100%; max-width: 420px; }

@media (max-height: 700px) {
  body.ingame .app { padding: 8px 10px; }
  #screen-game { gap: 4px; }
  #screen-game .panel { padding: 5px 8px; }
  .turnbar { padding: 4px; font-size: 0.8rem; }
  .ccard { width: 52px; height: 70px; }
  .ccard .ce { font-size: 1.2rem; }
  .prow { padding: 2px 6px; }
  .player-list { gap: 4px; }
  .acts .btn { padding: 6px 3px; font-size: 0.76rem; }
  #panel-log { min-height: 32px; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ LOBBY ============ -->
  <div id="screen-lobby" class="screen active">
    <h1>🎩 クー</h1>
    <p style="text-align:center; font-family:var(--mono); font-size:0.72rem; color:var(--muted); letter-spacing:1px;">嘘と疑いの陰謀ゲーム（2〜6人）</p>

    <input class="input" id="in-name" type="text" placeholder="ニックネームを入力（最大12文字）" maxlength="12" autocomplete="off">

    <div style="display:flex; flex-direction:column; gap:10px;">
      <button class="btn" id="btn-reconnect" style="display:none; background:rgba(45,189,110,0.15); color:#2dbd6e; border:1px solid rgba(45,189,110,0.5);" onclick="pgReconnect()"></button>
      <button class="btn btn-coup" onclick="createRoom()">🏠 部屋を作る（ホスト）</button>
      <div class="row">
        <input class="input code-input" id="in-code" type="number" placeholder="0000" maxlength="4" autocomplete="off" style="flex:1;">
        <button class="btn btn-blue" onclick="joinRoom()">参加</button>
      </div>
      <div class="panel">
        <h3 style="margin-bottom:8px;">ルール</h3>
        <div class="seg" id="mode-seg">
          <button class="btn on" data-m="base" onclick="setMode('base')">通常版</button>
          <button class="btn" data-m="reformation" onclick="setMode('reformation')">拡張版（宗教改革）</button>
        </div>
        <div class="tag" id="mode-desc" style="margin-top:6px; line-height:1.5;"></div>
      </div>
      <div class="divider"></div>
      <div class="panel">
        <h3 style="margin-bottom:8px;">🤖 練習モード（BOT対戦）</h3>
        <div class="seg" id="bot-seg">
          <button class="btn" data-b="1" onclick="setBots(1)">2人</button>
          <button class="btn on" data-b="3" onclick="setBots(3)">4人</button>
          <button class="btn" data-b="5" onclick="setBots(5)">6人</button>
        </div>
        <button class="btn" style="width:100%; margin-top:8px;" onclick="startSolo()">▶ ひとりで練習する</button>
      </div>
    </div>

    <div id="lobby-status" class="status-txt"></div>
    <div id="lobby-error" class="error"></div>

    <p style="text-align:center; font-size:0.72rem; color:var(--muted); line-height:1.6;">
      👑公爵 🗡️暗殺者 ⚓船長 🎭大使 🛡️夫人<br>
      持っていないキャラも「持っているフリ」ができる
    </p>

    <a href="index.html" style="text-decoration:none; margin-top:6px;">
      <button class="btn btn-ghost" style="width:100%;">← ホームに戻る</button>
    </a>
  </div>

  <!-- ============ WAITING ============ -->
  <div id="screen-waiting" class="screen">
    <h2>待機ロビー</h2>
    <div class="code-box">
      <div class="label">ルームコード</div>
      <div class="code" id="disp-code">----</div>
      <button class="btn btn-ghost btn-sm" onclick="copyCode()" style="margin-top:4px;">📋 コードをコピー</button>
    </div>
    <div class="panel">
      <h3 style="margin-bottom:8px;">ルール</h3>
      <div class="seg" id="wait-mode-seg">
        <button class="btn" data-m="base" onclick="setModeInRoom('base')">通常版</button>
        <button class="btn" data-m="reformation" onclick="setModeInRoom('reformation')">拡張版</button>
      </div>
      <div class="tag" id="wait-mode-desc" style="margin-top:6px; line-height:1.5;"></div>
    </div>
    <div class="panel">
      <h3 style="margin-bottom:8px;">プレイヤー（2〜6人）</h3>
      <div class="player-list" id="wait-players"></div>
    </div>
    <button class="btn btn-coup" id="btn-start" onclick="startGame()">▶ ゲーム開始</button>
    <div id="wait-status" class="status-txt"></div>
    <button class="btn btn-ghost" onclick="leaveRoom()">← 退出</button>
  </div>

  <!-- ============ GAME ============ -->
  <div id="screen-game" class="screen">
    <div class="row" style="justify-content:space-between;">
      <span class="hdr" id="hdr-left" style="flex:1; min-width:0;"></span>
      <button class="btn btn-ghost btn-exit" onclick="openRules()" title="ルール">📖</button>
      <button class="btn btn-ghost btn-exit" onclick="leaveRoom()">退出</button>
    </div>
    <div class="turnbar" id="turnbar"></div>

    <div class="panel" id="panel-main">
      <div class="msg" id="main-msg"></div>
      <div class="sub" id="main-sub"></div>
      <div id="main-ui" style="margin-top:7px;"></div>
    </div>

    <div class="panel">
      <h3 style="margin-bottom:6px;">プレイヤー</h3>
      <div class="player-list" id="players"></div>
    </div>

    <div class="panel" id="hand-panel">
      <h3 style="margin-bottom:6px;">あなたのカード<span style="text-transform:none; letter-spacing:0;" id="hand-hint"></span></h3>
      <div class="cards-row" id="myhand"></div>
    </div>

    <div class="panel" id="panel-log">
      <h3 style="margin-bottom:5px;">ログ</h3>
      <div class="log" id="game-log"></div>
    </div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="screen-result" class="screen">
    <div class="result-hero">
      <div class="result-emoji" id="result-emoji">🎩</div>
      <div class="result-title" id="result-title"></div>
      <div class="result-sub" id="result-sub"></div>
    </div>
    <div class="panel">
      <h3 style="margin-bottom:8px;">最終状況</h3>
      <div class="player-list" id="result-players"></div>
    </div>
    <button class="btn btn-coup" id="btn-rematch" onclick="rematch()" style="display:none;">🔄 もう一度</button>
    <div id="result-status" class="status-txt"></div>
    <button class="btn btn-ghost" onclick="leaveRoom()">← ロビーへ</button>
    <a href="index.html" style="text-decoration:none;"><button class="btn btn-ghost" style="width:100%;">🏠 ハブに戻る</button></a>
  </div>

</div>

<!-- FB CONFIG MODAL -->
<div class="modal-bg" id="fb-modal">
  <div class="modal">
    <h3 style="margin-bottom:10px;">Firebase 設定</h3>
    <p style="font-size:0.8rem; color:var(--muted); margin-bottom:10px;">Realtime Database の URL を入力してください。</p>
    <input class="input" id="fb-url" type="url" placeholder="https://xxxx.firebaseio.com">
    <button class="btn btn-coup" style="width:100%; margin-top:10px;" onclick="saveFbConfig()">保存</button>
  </div>
</div>

<script>
// ============================================================
// COUP（クー）
//  2〜6人。影響力カード2枚を守り、最後の1人になれば勝ち。
//  キャラは持っていなくても「持っているフリ」ができ、疑われたら証明する。
// ============================================================
const CHARS = {
  duke:       {name:'公爵',   emoji:'👑', color:'#a78bfa'},
  assassin:   {name:'暗殺者', emoji:'🗡️', color:'#94a3b8'},
  captain:    {name:'船長',   emoji:'⚓', color:'#38bdf8'},
  ambassador: {name:'大使',   emoji:'🎭', color:'#34d399'},
  contessa:   {name:'夫人',   emoji:'🛡️', color:'#f472b6'}
};
const CHAR_KEYS = Object.keys(CHARS);
const ACTIONS = {
  income:      {name:'収入',        cost:0, claim:null,        target:false, blockers:[],                       desc:'+1コイン（疑い・ブロック不可）'},
  foreign_aid: {name:'外国援助',    cost:0, claim:null,        target:false, blockers:['duke'], anyBlock:true,  desc:'+2コイン（公爵にブロックされる）'},
  coup:        {name:'クーデター',  cost:7, claim:null,        target:true,  blockers:[],                       desc:'7コインで影響力を1つ奪う（阻止不可）'},
  tax:         {name:'徴税',        cost:0, claim:'duke',      target:false, blockers:[],                       desc:'+3コイン'},
  assassinate: {name:'暗殺',        cost:3, claim:'assassin',  target:true,  blockers:['contessa'],             desc:'3コインで影響力を1つ奪う'},
  steal:       {name:'強奪',        cost:0, claim:'captain',   target:true,  blockers:['captain','ambassador'], desc:'相手から2コイン奪う'},
  exchange:    {name:'交換',        cost:0, claim:'ambassador',target:false, blockers:[],                       desc:'山札から2枚引いて入れ替える'},
  // ここから拡張（宗教改革）
  convert:     {name:'改宗',        cost:0, claim:null,        target:true,  blockers:[], exp:true, self:true,   desc:'自分1コイン／他人2コインで陣営を変える'},
  embezzle:    {name:'横領',        cost:0, claim:'noduke',    target:false, blockers:[], exp:true,              desc:'公爵を持っていないと宣言して救貧院を総取り'}
};
const FACTIONS = {
  catholic:   {name:'カトリック',   short:'カ', color:'#e0645f'},
  protestant: {name:'プロテスタント', short:'プ', color:'#5b9bd5'}
};
function claimLabel(k){ return k==='noduke' ? '公爵を持っていないと主張' : charName(k)+'を主張'; }
let RESOLVE_MS = 1500, BOT_WAIT = 800, BOT_WAIT_R = 600;
const BOT_NAMES = ['🤖アカ','🤖アオ','🤖キイロ','🤖ミドリ','🤖ムラサキ'];

function charName(k){ return CHARS[k] ? CHARS[k].emoji + CHARS[k].name : (k==='noduke' ? '公爵なし' : '?'); }

// ============================================================
// FIREBASE
// ============================================================
const FB_KEY = 'partyGamesFbUrl';
let fbUrl = localStorage.getItem(FB_KEY) || 'https://playgame-3e7ba-default-rtdb.firebaseio.com';
function saveFbConfig(){
  const url = g('fb-url').value.trim().replace(/\/$/,'');
  if(!url) return;
  fbUrl = url; localStorage.setItem(FB_KEY, url); g('fb-modal').style.display='none';
}
async function checkFbConfig(){
  if(!fbUrl){ g('fb-modal').style.display='flex'; return false; }
  try {
    const r = await fetch(`${fbUrl}/.json?shallow=true`);
    if(!r.ok && r.status !== 404){ setErr('Firebase接続エラー'); return false; }
  } catch(e){ setErr('Firebase接続失敗'); return false; }
  return true;
}
let fbRoom = '', fbPollTimer = null, fbLastBcastTs = 0, fbLastPrvTs = 0, fbLastActTs = {};
async function fbPut(sub, data){ if(!fbRoom) return; try { await fetch(`${fbUrl}/rooms/${fbRoom}/${sub}.json`, {method:'PUT', body:JSON.stringify(data)}); } catch(e){} }
async function fbGet(sub){ if(!fbRoom) return null; try { const r = await fetch(`${fbUrl}/rooms/${fbRoom}/${sub}.json`); if(!r.ok) return null; return await r.json(); } catch(e){ return null; } }
async function fbDel(sub){ if(!fbRoom) return; try { await fetch(`${fbUrl}/rooms/${fbRoom}/${sub}.json`, {method:'DELETE'}); } catch(e){} }
function fbListen(){
  if(fbPollTimer) clearInterval(fbPollTimer);
  fbLastBcastTs = 0; fbLastPrvTs = 0; fbLastActTs = {};
  fbPollTimer = setInterval(fbPoll, 500);
}
function fbClose(){ if(fbPollTimer) clearInterval(fbPollTimer); fbPollTimer = null; fbRoom = ''; }
async function fbPoll(){
  if(!fbRoom) return;
  const bc = await fbGet('broadcast');
  if(bc && bc.ts > fbLastBcastTs){ fbLastBcastTs = bc.ts; if(!isHost && bc.msg) handleBroadcast(bc.msg); }
  const prv = await fbGet(`private/${myId}`);
  if(prv && prv.ts > fbLastPrvTs){ fbLastPrvTs = prv.ts; if(prv.msg) handlePrivate(prv.msg); }
  if(isHost){
    const acts = await fbGet('action');
    if(acts) for(const pid in acts){
      const a = acts[pid];
      if(a && a.ts > (fbLastActTs[pid]||0)){ fbLastActTs[pid] = a.ts; if(a.msg) onMsg(a.msg, pid); }
    }
  }
}
function fbBroadcast(msg){ fbPut('broadcast', {ts:Date.now(), msg}); }
function fbSendTo(pid, msg){ fbPut(`private/${pid}`, {ts:Date.now(), msg}); }
function fbSendToHost(msg){ if(isSolo){ onMsg(msg, myId); return; } fbPut(`action/${myId}`, {ts:Date.now(), msg}); }

// ============================================================
// STATE
// ============================================================
let myId = genId(), myName = '';
let isHost = false, isSolo = false, roomCode = '';
let fs = null, gs = null, myCards = [];
let soloBots = 3, botTimer = null, prevActPid = null;
let uiTarget = null, uiPick = [], uiMode = 'base';

function g(id){ return document.getElementById(id); }
function mk(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }
function show(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = g('screen-'+name); if(el) el.classList.add('active');
  document.body.classList.toggle('ingame', name==='game');
}
function setErr(m){ const e=g('lobby-error'); if(e) e.textContent = m||''; }
function setSt(m){ const s=g('lobby-status'); if(s) s.textContent = m||''; }
function genId(){ return 'p_' + Math.random().toString(36).slice(2,10); }
function shuffle(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function copyCode(){ navigator.clipboard?.writeText(g('disp-code').textContent); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let audioCtx = null;
document.addEventListener('pointerdown', ()=>{ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }, {once:true});
function notifyTurn(){
  try{ if(navigator.vibrate) navigator.vibrate(120); }catch(e){}
  try{
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), gn=audioCtx.createGain();
    o.frequency.value=880; gn.gain.value=0.06;
    o.connect(gn); gn.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.09);
  }catch(e){}
}

const MODE_DESC = {
  base: '5キャラ＋7アクションの基本ルール',
  reformation: 'カトリック／プロテスタントの陣営が加わり、同じ陣営は攻撃できない。「改宗」「横領」の2アクションが増えます'
};
function setMode(m){
  uiMode = m;
  document.querySelectorAll('#mode-seg .btn').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  const d = g('mode-desc'); if(d) d.textContent = MODE_DESC[m];
}
function setModeInRoom(m){
  if(!isHost) return;
  uiMode = m;
  send({type:'mode', mode:m});
}
setTimeout(()=>setMode('base'), 0);
function setBots(n){
  soloBots = n;
  document.querySelectorAll('#bot-seg .btn').forEach(b=>b.classList.toggle('on', +b.dataset.b===n));
}
async function createRoom(){
  if(!(await checkFbConfig())) return;
  const name = g('in-name').value.trim();
  if(!name){ setErr('名前を入力してください'); return; }
  myName=name; isHost=true; isSolo=false;
  const code = Array.from({length:4}, ()=>Math.floor(Math.random()*10)).join('');
  roomCode=code; fbRoom='CP-'+code;
  setSt('接続中...');
  try{
    myId = genId();
    await fbDel('');
    await fbPut('meta', {host:myId, game:'coup', ts:Date.now()});
    fs = initFs([{id:myId, name:myName, bot:false}], uiMode);
    fbListen(); pgSaveSession();
    setErr(''); setSt('');
    g('disp-code').textContent = code;
    show('waiting'); bcast();
  }catch(e){ setErr(e.message||'エラー'); setSt(''); isHost=false; }
}
async function joinRoom(){
  if(!(await checkFbConfig())) return;
  const name = g('in-name').value.trim();
  if(!name){ setErr('名前を入力してください'); return; }
  const code = g('in-code').value.trim();
  if(!/^\d{4}$/.test(code)){ setErr('4桁の数字'); return; }
  myName=name; isHost=false; isSolo=false; roomCode=code; fbRoom='CP-'+code;
  setSt('接続中...');
  try{
    myId = genId();
    const meta = await fbGet('meta');
    if(!meta){ setErr('ルームが見つかりません'); setSt(''); fbRoom=''; return; }
    if(meta.game !== 'coup'){ setErr('ゲーム種別が違います'); setSt(''); fbRoom=''; return; }
    fbListen(); pgSaveSession();
    fbSendToHost({type:'join', name:myName, id:myId});
    setSt('接続しました...');
    show('waiting');
    g('disp-code').textContent = code;
    g('btn-start').style.display='none';
    let retries=0;
    const rj = setInterval(()=>{
      if(!fbRoom || retries>=5){ clearInterval(rj); return; }
      if(gs?.players?.find(p=>p.id===myId)){ clearInterval(rj); return; }
      fbSendToHost({type:'join', name:myName, id:myId}); retries++;
    }, 2000);
  }catch(e){ setErr(e.message||'エラー'); setSt(''); }
}
function startSolo(){
  const name = g('in-name').value.trim() || 'あなた';
  myName=name; isHost=true; isSolo=true; roomCode=''; fbRoom=''; myId=genId();
  const players=[{id:myId, name:myName, bot:false}];
  for(let i=0;i<soloBots;i++) players.push({id:'bot_'+i, name:BOT_NAMES[i], bot:true});
  fs = initFs(players, uiMode);
  setErr(''); setSt('');
  hostStart();
}
function leaveRoom(){
  if(botTimer) clearTimeout(botTimer);
  pgClearSession(); fbClose();
  fs=null; gs=null; isHost=false; isSolo=false; myCards=[]; prevActPid=null;
  show('lobby'); pgShowReconnect();
}

// ============================================================
// HOST: 状態
// ============================================================
function initFs(players, mode){
  return {
    phase:'waiting', mode: mode || 'base', almshouse: 0,
    players: players.map(p=>({id:p.id, name:p.name, bot:!!p.bot, cards:[], coins:0, out:false, faction:'catholic'})),
    deck: [], turnIdx: 0, startIdx: 0,
    pending: null, lose: null, exch: null,
    lock:false, winner:null, log:[]
  };
}
function addLog(t){ fs.log.push(t); if(fs.log.length>80) fs.log = fs.log.slice(-80); }
function P(pid){ return fs.players.find(p=>p.id===pid); }
function alive(p){ return !p.out; }
function liveCards(p){ return p.cards.filter(c=>!c.dead); }
function livingPlayers(){ return fs.players.filter(alive); }

function deal(){
  let deck = [];
  for(const k of CHAR_KEYS) for(let i=0;i<3;i++) deck.push(k);
  deck = shuffle(deck);
  fs.players.forEach(p=>{
    p.cards = [{c:deck.pop(), dead:false}, {c:deck.pop(), dead:false}];
    p.coins = 2; p.out = false;
  });
  fs.deck = deck;
  fs.pending=null; fs.lose=null; fs.exch=null; fs.lock=false; fs.winner=null;
  fs.almshouse = 0;
  if(fs.mode==='reformation'){
    // 1番手が任意の陣営を選び、以降は交互に振り分ける（＝人数を均等に分ける）
    const first = Math.random()<0.5 ? 'catholic' : 'protestant';
    fs.players.forEach((p,i)=>{
      const idx = (i - fs.startIdx + fs.players.length) % fs.players.length;
      p.faction = (idx % 2 === 0) ? first : (first==='catholic' ? 'protestant' : 'catholic');
    });
  } else {
    fs.players.forEach(p=>p.faction='catholic');
  }
}
// 拡張：同じ陣営には強奪・暗殺・クーデターができず、援助のブロックもできない
// （全員が同じ陣営になった場合は制限しない）
function factionLocked(aPid, bPid){
  if(!fs || fs.mode!=='reformation') return false;
  const a=P(aPid), b=P(bPid);
  if(!a || !b || a.id===b.id) return false;
  if(a.faction !== b.faction) return false;
  const set = {};
  livingPlayers().forEach(p=>{ set[p.faction]=1; });
  return Object.keys(set).length > 1;
}
function hostStart(){
  const n = fs.players.length;
  if(n<2 || n>6){ if(!isSolo) setErr('2〜6人で開始できます'); return; }
  fs.startIdx = Math.floor(Math.random()*n);
  deal();
  fs.turnIdx = fs.startIdx;
  fs.phase = 'play';
  addLog(`ゲーム開始（${n}人・各自2枚のカードと2コイン${fs.mode==='reformation'?' / 拡張：宗教改革':''}）`);
  if(fs.mode==='reformation'){
    addLog('⛪ 陣営：' + fs.players.map(p=>`${p.name}=${FACTIONS[p.faction].short}`).join(' '));
  }
  addLog(`▶ ${fs.players[fs.turnIdx].name} の手番`);
  sendHands(); bcast();
}
function startGame(){ if(isHost) hostStart(); }
function hostRematch(){
  fs.startIdx = (fs.startIdx+1) % fs.players.length;
  deal();
  fs.turnIdx = fs.startIdx;
  fs.phase = 'play';
  addLog('── もう一度 ──');
  if(fs.mode==='reformation') addLog('⛪ 陣営：' + fs.players.map(p=>`${p.name}=${FACTIONS[p.faction].short}`).join(' '));
  addLog(`▶ ${fs.players[fs.turnIdx].name} の手番`);
  sendHands(); bcast();
}
function rematch(){ if(isHost) hostRematch(); else g('result-status').textContent='ホストの「もう一度」を待っています'; }

// ============================================================
// HOST: メッセージ
// ============================================================
function onMsg(d, pid){
  if(!d || !fs) return;
  switch(d.type){
    case 'join': {
      const ex = fs.players.find(p=>p.id===d.id);
      if(ex){ bcast(); sendHand(ex); return; }
      if(fs.phase!=='waiting'){ fbSendTo(d.id, {type:'error', msg:'ゲーム開始済み'}); return; }
      if(fs.players.length>=6){ fbSendTo(d.id, {type:'error', msg:'満員（最大6人）'}); return; }
      fs.players.push({id:d.id, name:d.name, bot:false, cards:[], coins:0, out:false});
      bcast(); break;
    }
    case 'mode': {
      if(fs.phase!=='waiting') return;
      if(pid !== fs.players[0]?.id) return;           // ホストのみ変更可
      if(d.mode!=='base' && d.mode!=='reformation') return;
      fs.mode = d.mode; bcast(); break;
    }
    case 'action':  doAction(pid, d.act, d.target); break;
    case 'respond': doRespond(pid, d.act, d.claim); break;
    case 'lose':    doLose(pid, d.idx); break;
    case 'exchange':doExchange(pid, d.keep); break;
  }
}

// ---------- 行動の宣言 ----------
function doAction(pid, act, target){
  if(fs.phase!=='play' || fs.lock) return;
  const p = fs.players[fs.turnIdx];
  if(!p || p.id!==pid || p.out) return;
  const A = ACTIONS[act];
  if(!A) return;
  if(A.exp && fs.mode!=='reformation') return;        // 拡張アクションは拡張版のみ
  if(p.coins >= 10 && act !== 'coup') return;        // 10枚以上はクーデター強制
  let cost = A.cost;
  let tp = null;
  if(A.target){
    tp = P(target);
    if(!tp || tp.out) return;
    if(!A.self && tp.id===pid) return;
    if(act==='convert') cost = (tp.id===pid) ? 1 : 2;
    else if(factionLocked(pid, tp.id)) return;        // 同じ陣営は狙えない
  }
  if(p.coins < cost) return;
  p.coins -= cost;                                    // コストは宣言時に支払う
  if(act==='convert') fs.almshouse += cost;           // 改宗のコインは救貧院へ
  fs.pending = {
    act, actor:pid, target: tp ? tp.id : null,
    claim: A.claim, stage:'action', noChallenge:false,
    blocker:null, blockClaim:null, responded:{}
  };
  const tx = tp ? ` → ${tp.id===pid ? '自分' : tp.name}` : '';
  const cl = A.claim ? `（${claimLabel(A.claim)}）` : '';
  addLog(`${p.name}：${A.name}${tx}${cl}`);
  openWindow();
}

// ---------- 応答ウィンドウ ----------
function eligibleResponders(){
  const pd = fs.pending; if(!pd) return [];
  const excl = pd.stage==='block' ? pd.blocker : pd.actor;
  return livingPlayers().filter(p=>p.id!==excl);
}
function canChallengeNow(pid){
  const pd = fs.pending; if(!pd) return false;
  if(pd.stage==='block') return !!pd.blockClaim;
  return !!pd.claim && !pd.noChallenge;
}
function blockOptions(pid){
  const pd = fs.pending;
  if(!pd || pd.stage!=='action') return [];
  const A = ACTIONS[pd.act];
  if(!A.blockers.length) return [];
  if(A.anyBlock) return factionLocked(pd.actor, pid) ? [] : A.blockers.slice();
  return pd.target===pid ? A.blockers.slice() : [];
}
function openWindow(){
  const pd = fs.pending;
  const A = ACTIONS[pd.act];
  const anyChallenge = canChallengeNow(null) || (pd.stage==='action' && !!pd.claim && !pd.noChallenge);
  const anyBlock = pd.stage==='action' && A.blockers.length>0;
  if(!anyChallenge && !anyBlock){ resolveAction(); return; }
  const el = eligibleResponders().filter(p=>canChallengeNow(p.id) || blockOptions(p.id).length>0);
  if(el.length===0){
    if(pd.stage==='block'){ finishBlocked(); return; }
    resolveAction(); return;
  }
  fs.phase = 'respond';
  bcast();
}
function doRespond(pid, act, claim){
  if(fs.phase!=='respond' || fs.lock) return;
  const pd = fs.pending; if(!pd) return;
  const p = P(pid);
  if(!p || p.out) return;
  if(!eligibleResponders().some(x=>x.id===pid)) return;
  if(pd.responded[pid]) return;

  if(act==='challenge'){
    if(!canChallengeNow(pid)) return;
    if(pd.stage==='block') resolveChallenge(pid, pd.blocker, pd.blockClaim, true);
    else resolveChallenge(pid, pd.actor, pd.claim, false);
    return;
  }
  if(act==='block'){
    const opts = blockOptions(pid);
    if(!opts.includes(claim)) return;
    pd.blocker = pid; pd.blockClaim = claim; pd.stage='block'; pd.responded = {};
    addLog(`🛑 ${p.name} がブロック（${charName(claim)}を主張）`);
    openWindow();
    return;
  }
  // pass
  pd.responded[pid] = 1;
  const el = eligibleResponders().filter(x=>canChallengeNow(x.id) || blockOptions(x.id).length>0);
  if(el.every(x=>pd.responded[x.id])){
    if(pd.stage==='block') finishBlocked();
    else resolveAction();
    return;
  }
  bcast();
}

// ---------- ダウト（チャレンジ）の解決 ----------
function resolveChallenge(challengerPid, claimantPid, claim, onBlock){
  const ch = P(challengerPid), cm = P(claimantPid);
  addLog(`❓ ${ch.name} が ${cm.name} にダウト（${charName(claim)}）`);
  const noDuke = (claim === 'noduke');
  const card = noDuke ? null : liveCards(cm).find(c=>c.c===claim);
  const proven = noDuke ? !liveCards(cm).some(c=>c.c==='duke') : !!card;
  fs.lock = true;
  if(proven){
    // 証明できた → カードを山札に戻して引き直し、ダウトした側が影響力を失う
    if(noDuke){
      addLog(`✅ ${cm.name} の手札に公爵はなかった！ ダウト失敗（全カードを引き直し）`);
      const live = liveCards(cm);
      live.forEach(c=>fs.deck.push(c.c));
      fs.deck = shuffle(fs.deck);
      live.forEach(c=>{ c.c = fs.deck.pop(); });
    } else {
      addLog(`✅ ${cm.name} は ${charName(claim)} を提示！ ダウト失敗`);
      fs.deck.push(card.c);
      fs.deck = shuffle(fs.deck);
      card.c = fs.deck.pop();
    }
    sendHand(cm);
    fs.lock = false;
    const A = ACTIONS[fs.pending.act];
    let resume;
    if(onBlock) resume = 'blocked';                                  // ブロック成立 → 行動は失敗
    else resume = (A.blockers.length>0) ? 'reopen' : 'resolve';      // 行動は続行（ブロックの余地あり）
    needLose(challengerPid, resume);
  } else {
    addLog(noDuke ? `❌ ${cm.name} は公爵を持っていた！` : `❌ ${cm.name} は ${charName(claim)} を出せなかった`);
    fs.lock = false;
    const resume = onBlock ? 'resolve' : 'end';   // ブロック失敗→行動続行 / 行動が嘘→行動中止
    needLose(claimantPid, resume);
  }
}

// ---------- 影響力を失う ----------
function needLose(pid, resume){
  const p = P(pid);
  if(!p || p.out){ continueFlow(resume); return; }
  const live = liveCards(p);
  if(live.length===0){ continueFlow(resume); return; }
  if(live.length===1){ killCard(p, p.cards.indexOf(live[0])); continueFlow(resume); return; }
  fs.lose = {pid, resume};
  fs.phase = 'lose';
  bcast();
}
function killCard(p, idx){
  const c = p.cards[idx];
  if(!c || c.dead) return;
  c.dead = true;
  addLog(`💀 ${p.name} が ${charName(c.c)} を失った`);
  if(liveCards(p).length===0){ p.out = true; addLog(`☠️ ${p.name} は脱落`); }
  sendHand(p);
}
function doLose(pid, idx){
  if(fs.phase!=='lose' || !fs.lose || fs.lose.pid!==pid) return;
  const p = P(pid);
  const c = p.cards[idx];
  if(!c || c.dead) return;
  killCard(p, idx);
  const resume = fs.lose.resume;
  fs.lose = null;
  continueFlow(resume);
}
function continueFlow(resume){
  if(checkWin()) return;
  switch(resume){
    case 'resolve': resolveAction(); break;
    case 'reopen': {
      const pd = fs.pending;
      if(!pd){ endTurn(); break; }
      pd.noChallenge = true; pd.stage='action'; pd.responded = {};
      openWindow();
      break;
    }
    case 'blocked': finishBlocked(); break;
    default: endTurn(); break;
  }
}

// ---------- 行動の実行 ----------
function finishBlocked(){
  const pd = fs.pending;
  if(pd){
    const b = P(pd.blocker);
    addLog(`🛑 ${ACTIONS[pd.act].name} はブロックされた${b?`（${b.name}）`:''}`);
  }
  fs.pending = null;
  endTurn();
}
function resolveAction(){
  const pd = fs.pending;
  if(!pd){ endTurn(); return; }
  const p = P(pd.actor), A = ACTIONS[pd.act];
  if(!p || p.out){ fs.pending=null; endTurn(); return; }
  switch(pd.act){
    case 'income':      p.coins += 1; addLog(`💰 ${p.name} が1コイン獲得`); break;
    case 'foreign_aid': p.coins += 2; addLog(`💰 ${p.name} が2コイン獲得`); break;
    case 'tax':         p.coins += 3; addLog(`💰 ${p.name} が3コイン獲得（徴税）`); break;
    case 'steal': {
      const t = P(pd.target);
      if(t && !t.out){
        const n = Math.min(2, t.coins);
        t.coins -= n; p.coins += n;
        addLog(`💰 ${p.name} が ${t.name} から${n}コイン奪った`);
      }
      break;
    }
    case 'coup':
    case 'assassinate': {
      const t = P(pd.target);
      addLog(`${pd.act==='coup'?'💥 クーデター':'🗡️ 暗殺'}が成立（対象：${t?t.name:'—'}）`);
      fs.pending = null;
      if(t && !t.out){ needLose(t.id, 'end'); return; }
      endTurn(); return;
    }
    case 'convert': {
      const t = P(pd.target);
      if(t){
        t.faction = (t.faction==='catholic') ? 'protestant' : 'catholic';
        addLog(`⛪ ${t.id===p.id?p.name+'（自分）':t.name} は ${FACTIONS[t.faction].name} に改宗（救貧院 💰${fs.almshouse}）`);
      }
      break;
    }
    case 'embezzle': {
      const n = fs.almshouse;
      p.coins += n; fs.almshouse = 0;
      addLog(`💰 ${p.name} が救貧院から${n}コインを横領`);
      break;
    }
    case 'exchange': {
      const draw = [fs.deck.pop(), fs.deck.pop()].filter(x=>x);
      const live = liveCards(p);
      fs.exch = {pid:p.id, pool: live.map(c=>c.c).concat(draw), keep: live.length};
      fs.pending = null;
      fs.phase = 'exchange';
      addLog(`🎭 ${p.name} がカードを交換中...`);
      sendExchange(p);
      bcast();
      return;
    }
  }
  fs.pending = null;
  endTurn();
}
function doExchange(pid, keep){
  if(fs.phase!=='exchange' || !fs.exch || fs.exch.pid!==pid) return;
  const p = P(pid), ex = fs.exch;
  if(!Array.isArray(keep) || keep.length !== ex.keep) return;
  const pool = ex.pool.slice(), chosen = [];
  for(const i of keep){
    if(typeof i!=='number' || i<0 || i>=ex.pool.length) return;
    if(chosen.includes(i)) return;
    chosen.push(i);
  }
  const kept = chosen.map(i=>pool[i]);
  const back = pool.filter((_,i)=>!chosen.includes(i));
  let k = 0;
  p.cards.forEach(c=>{ if(!c.dead){ c.c = kept[k++]; } });
  fs.deck = shuffle(fs.deck.concat(back));
  fs.exch = null;
  addLog(`🎭 ${p.name} が交換を終えた`);
  sendHand(p);
  endTurn();
}

// ---------- ターン進行 ----------
function endTurn(){
  fs.pending = null; fs.lose = null; fs.exch = null; fs.lock = false;
  if(checkWin()) return;
  const n = fs.players.length;
  let i = fs.turnIdx;
  for(let k=0;k<n;k++){
    i = (i+1)%n;
    if(alive(fs.players[i])){ fs.turnIdx = i; break; }
  }
  fs.phase = 'play';
  addLog(`▶ ${fs.players[fs.turnIdx].name} の手番`);
  bcast();
}
function checkWin(){
  const live = livingPlayers();
  if(live.length<=1){
    fs.phase='result';
    fs.winner = live.length ? {pid:live[0].id, name:live[0].name} : null;
    addLog(`🏆 ${live.length?live[0].name:'—'} の勝利！`);
    bcast();
    if(!isSolo) fbPut('meta', {host:myId, game:'coup', ts:Date.now()});
    return true;
  }
  return false;
}

// ============================================================
// HOST: 配信
// ============================================================
function pubPlayer(p){
  return { id:p.id, name:p.name, bot:p.bot, coins:p.coins, out:p.out, faction:p.faction,
           cards: p.cards.map(c=>({dead:c.dead, c: c.dead ? c.c : null})) };
}
function pubFs(f){
  const pd = f.pending;
  return {
    phase:f.phase, turnIdx:f.turnIdx, lock:f.lock, winner:f.winner,
    mode:f.mode, almshouse:f.almshouse, deckCount: f.deck.length,
    players: f.players.map(pubPlayer),
    pending: pd ? {act:pd.act, actor:pd.actor, target:pd.target, claim:pd.claim,
                   stage:pd.stage, noChallenge:pd.noChallenge,
                   blocker:pd.blocker, blockClaim:pd.blockClaim,
                   responded:Object.assign({}, pd.responded)} : null,
    lose: f.lose ? {pid:f.lose.pid} : null,
    exch: f.exch ? {pid:f.exch.pid, keep:f.exch.keep} : null,
    log: f.log.slice(-40)
  };
}
function bcast(){
  if(!fs) return;
  gs = pubFs(fs);
  const msg = {type:'state', s:gs};
  if(isSolo){ handleBroadcast(msg); }
  else { fbBroadcast(msg); if(!fs.lock) pgSaveHostState(); handleBroadcast(msg); }
  maybeBot();
}
function sendHand(p){
  if(p.bot) return;
  const msg = {type:'cards', cards:p.cards.map(c=>({c:c.c, dead:c.dead}))};
  if(p.id===myId) handlePrivate(msg);
  else if(!isSolo) fbSendTo(p.id, msg);
}
function sendHands(){ fs.players.forEach(sendHand); }
function sendExchange(p){
  if(p.bot) return;
  const msg = {type:'exchPool', pool: fs.exch.pool.slice(), keep: fs.exch.keep};
  if(p.id===myId) handlePrivate(msg);
  else if(!isSolo) fbSendTo(p.id, msg);
}

// CLIENT
// ============================================================
let myExch = null;
function handleBroadcast(msg){
  if(!msg) return;
  if(msg.type==='state'){
    gs = msg.s;
    if(gs.phase!=='exchange') myExch = null;
    routeScreen();
    const act = actorPid();
    if(gs.phase!=='result' && act===myId && prevActPid!==myId && !gs.lock) notifyTurn();
    prevActPid = act;
  }
}
function handlePrivate(msg){
  if(!msg) return;
  if(msg.type==='cards'){ myCards = msg.cards.slice(); if(gs) renderGame(); }
  if(msg.type==='exchPool'){ myExch = {pool:msg.pool.slice(), keep:msg.keep}; uiPick=[]; if(gs) renderGame(); }
  if(msg.type==='error'){ setErr(msg.msg||'エラー'); show('lobby'); fbClose(); pgClearSession(); }
}
function actorPid(){
  if(!gs) return null;
  if(gs.phase==='play') return gs.players[gs.turnIdx]?.id;
  if(gs.phase==='lose') return gs.lose?.pid;
  if(gs.phase==='exchange') return gs.exch?.pid;
  return null;
}
function routeScreen(){
  if(!gs) return;
  if(gs.phase==='waiting'){ show('waiting'); renderWaiting(); }
  else if(gs.phase==='result'){ show('result'); renderResult(); }
  else { show('game'); renderGame(); }
}
function send(msg){ if(isHost||isSolo) onMsg(msg, myId); else fbSendToHost(msg); }
function meP(){ return gs ? gs.players.find(p=>p.id===myId) : null; }

// ---------- UIアクション ----------
function uiAct(act){
  if(!gs || gs.phase!=='play' || gs.lock) return;
  if(gs.players[gs.turnIdx]?.id !== myId) return;
  const A = ACTIONS[act];
  if(A.target){
    if(!uiTarget){ uiTarget = act; renderGame(); return; }
  }
  send({type:'action', act, target:null});
}
function uiActOn(act, target){ send({type:'action', act, target}); uiTarget=null; }
function uiCancelTarget(){ uiTarget=null; renderGame(); }
function uiRespond(act, claim){
  if(!gs || gs.phase!=='respond' || gs.lock) return;
  send({type:'respond', act, claim});
}
function uiLose(idx){
  if(!gs || gs.phase!=='lose' || gs.lose?.pid!==myId) return;
  send({type:'lose', idx});
}
function uiPickExch(i){
  if(!myExch) return;
  const k = uiPick.indexOf(i);
  if(k>=0) uiPick.splice(k,1);
  else if(uiPick.length < myExch.keep) uiPick.push(i);
  renderGame();
}
function uiConfirmExch(){
  if(!myExch || uiPick.length !== myExch.keep) return;
  send({type:'exchange', keep: uiPick.slice()});
  myExch = null; uiPick = [];
}

// 選べる対象（拡張の陣営制限を反映）
function factionLockedUI(aPid, bPid){
  if(!gs || gs.mode!=='reformation') return false;
  const a = gs.players.find(p=>p.id===aPid), b = gs.players.find(p=>p.id===bPid);
  if(!a || !b || a.id===b.id) return false;
  if(a.faction !== b.faction) return false;
  const set = {};
  gs.players.filter(p=>!p.out).forEach(p=>{ set[p.faction]=1; });
  return Object.keys(set).length > 1;
}
function targetsFor(act){
  const A = ACTIONS[act];
  if(!A || !A.target || !gs) return [];
  return gs.players.filter(p=>{
    if(p.out) return false;
    if(p.id===myId) return !!A.self;
    if(act==='convert') return true;
    return !factionLockedUI(myId, p.id);
  });
}
function minCost(act){
  if(act==='convert') return 1;
  return ACTIONS[act].cost;
}
function eligibleUI(pid){
  const pd = gs.pending; if(!pd) return false;
  const p = gs.players.find(x=>x.id===pid);
  if(!p || p.out) return false;
  const excl = pd.stage==='block' ? pd.blocker : pd.actor;
  if(pid===excl) return false;
  return canChallengeUI(pid) || blockOptionsUI(pid).length>0;
}
function canChallengeUI(pid){
  const pd = gs.pending; if(!pd) return false;
  if(pd.stage==='block') return !!pd.blockClaim;
  return !!pd.claim && !pd.noChallenge;
}
function blockOptionsUI(pid){
  const pd = gs.pending;
  if(!pd || pd.stage!=='action') return [];
  const A = ACTIONS[pd.act];
  if(!A.blockers.length) return [];
  if(A.anyBlock) return factionLockedUI(pd.actor, pid) ? [] : A.blockers.slice();
  return pd.target===pid ? A.blockers.slice() : [];
}
function canIRespond(){ return eligibleUI(myId) && !gs.pending?.responded?.[myId]; }

    }

// ============================================================
// BOT
// ============================================================
const CARD_VALUE = {duke:3.0, assassin:2.6, captain:2.4, ambassador:2.2, contessa:2.0};
function maybeBot(){
  if(botTimer){ clearTimeout(botTimer); botTimer=null; }
  if(!fs || !(isHost||isSolo)) return;
  if(fs.lock || fs.phase==='waiting' || fs.phase==='result') return;
  let target = null;
  if(fs.phase==='play') target = fs.players[fs.turnIdx];
  else if(fs.phase==='lose') target = P(fs.lose.pid);
  else if(fs.phase==='exchange') target = P(fs.exch.pid);
  else if(fs.phase==='respond'){
    const el = eligibleResponders().filter(p=>p.bot && !fs.pending.responded[p.id]
      && (canChallengeNow(p.id) || blockOptions(p.id).length>0));
    target = el[0] || null;
  }
  if(!target || !target.bot) return;
  const pid = target.id, phase = fs.phase;
  botTimer = setTimeout(()=>botAct(pid, phase), BOT_WAIT + Math.random()*BOT_WAIT_R);
}
function botHas(p, k){ return liveCards(p).some(c=>c.c===k); }
function botPickTarget(bot){
  const c = livingPlayers().filter(p=>p.id!==bot.id && !factionLocked(bot.id, p.id));
  if(!c.length) return null;
  c.sort((a,b)=>(liveCards(b).length*10+b.coins)-(liveCards(a).length*10+a.coins));
  return c[0].id;
}
// 少数派の陣営にいると狙われやすいので、多数派へ移りたいかを判定する
function botWantConvert(bot){
  if(fs.mode!=='reformation' || bot.coins<1) return null;
  const cnt = {catholic:0, protestant:0};
  livingPlayers().forEach(p=>cnt[p.faction]++);
  const other = bot.faction==='catholic' ? 'protestant' : 'catholic';
  if(cnt[bot.faction] < cnt[other]) return bot.id;   // 自分を多数派へ（1コイン）
  return null;
}
function botAct(pid, phase){
  botTimer = null;
  if(!fs || fs.lock || fs.phase!==phase) return;
  const bot = P(pid);
  if(!bot || !bot.bot || bot.out) return;

  if(fs.phase==='play'){
    if(fs.players[fs.turnIdx]?.id !== pid) return;
    const tgt = botPickTarget(bot);
    if(bot.coins>=10 || (bot.coins>=7 && Math.random()<0.75)){
      if(tgt){ doAction(pid,'coup',tgt); return; }
      if(bot.coins>=10){ doAction(pid,'income'); return; }   // 対象がいなければ収入で流す
    }
    if(fs.mode==='reformation'){
      // 救貧院にコインが貯まっていて公爵を持っていなければ横領（正直な宣言）
      if(fs.almshouse>=2 && !botHas(bot,'duke') && Math.random()<0.8){ doAction(pid,'embezzle'); return; }
      const cv = botWantConvert(bot);
      if(cv && Math.random()<0.35){ doAction(pid,'convert',cv); return; }
      if(fs.almshouse>=4 && Math.random()<0.15){ doAction(pid,'embezzle'); return; }   // ブラフ横領
    }
    if(botHas(bot,'assassin') && bot.coins>=3 && tgt){ doAction(pid,'assassinate',tgt); return; }
    if(botHas(bot,'duke')){ doAction(pid,'tax'); return; }
    if(botHas(bot,'captain') && tgt && P(tgt).coins>0){ doAction(pid,'steal',tgt); return; }
    if(botHas(bot,'ambassador') && Math.random()<0.45){ doAction(pid,'exchange'); return; }
    // ブラフ
    const r = Math.random();
    if(r<0.22){ doAction(pid,'tax'); return; }                       // 公爵のフリ
    if(r<0.30 && tgt && P(tgt).coins>0){ doAction(pid,'steal',tgt); return; }
    if(r<0.55){ doAction(pid,'foreign_aid'); return; }
    doAction(pid,'income');
    return;
  }

  if(fs.phase==='lose'){
    if(fs.lose?.pid!==pid) return;
    const live = liveCards(bot);
    live.sort((a,b)=>(CARD_VALUE[a.c]||0)-(CARD_VALUE[b.c]||0));
    doLose(pid, bot.cards.indexOf(live[0]));
    return;
  }

  if(fs.phase==='exchange'){
    if(fs.exch?.pid!==pid) return;
    const pool = fs.exch.pool.map((c,i)=>({c,i}));
    pool.sort((a,b)=>(CARD_VALUE[b.c]||0)-(CARD_VALUE[a.c]||0));
    doExchange(pid, pool.slice(0, fs.exch.keep).map(x=>x.i));
    return;
  }

  if(fs.phase==='respond'){
    const pd = fs.pending; if(!pd || pd.responded[pid]) return;
    if(!eligibleResponders().some(x=>x.id===pid)) return;
    // ブロックの検討
    const opts = blockOptions(pid);
    if(opts.length){
      const own = opts.find(k=>botHas(bot,k));
      if(own){ doRespond(pid,'block',own); return; }
      if(Math.random()<0.25){ doRespond(pid,'block',opts[Math.floor(Math.random()*opts.length)]); return; }
    }
    // ダウトの検討
    if(canChallengeNow(pid)){
      const claim = pd.stage==='block' ? pd.blockClaim : pd.claim;
      let pr;
      if(claim==='noduke'){
        // 公爵が場に多く見えているほど「持っていない」宣言は本当らしい
        let dukeSeen = liveCards(bot).filter(c=>c.c==='duke').length;
        fs.players.forEach(p=>p.cards.forEach(c=>{ if(c.dead && c.c==='duke') dukeSeen++; }));
        pr = 0.30 - dukeSeen*0.09;
        if(fs.almshouse>=4) pr += 0.10;
      } else {
      // 自分と場に見えている枚数から、相手が持っている確率をざっくり見積もる
      let seen = liveCards(bot).filter(c=>c.c===claim).length;
      fs.players.forEach(p=>p.cards.forEach(c=>{ if(c.dead && c.c===claim) seen++; }));
      pr = 0.10 + seen*0.22;
      const danger = pd.stage==='action' && (pd.act==='assassinate' || pd.act==='coup') && pd.target===pid;
      if(danger) pr += 0.25;
      }
      if(liveCards(bot).length===1) pr -= 0.12;
      if(Math.random() < pr){ doRespond(pid,'challenge'); return; }
    }
    doRespond(pid,'pass');
  }
}

// ============================================================
// SESSION
// ============================================================
const PG_SESSION_KEY = 'pgSession_coup';
let pgLastTouch = 0;
function pgSaveSession(){ if(isSolo) return; pgLastTouch=Date.now(); try{ localStorage.setItem(PG_SESSION_KEY, JSON.stringify({myId,myName,roomCode,fbRoom,isHost,ts:Date.now()})); }catch(e){} }
function pgTouchSession(){ if(isSolo || !fbRoom) return; if(Date.now()-pgLastTouch < 60000) return; pgSaveSession(); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && fbRoom && !isSolo) pgSaveSession(); });
window.addEventListener('pagehide', ()=>{ if(fbRoom && !isSolo) pgSaveSession(); });
function pgLoadSession(){ try{ const r=localStorage.getItem(PG_SESSION_KEY); if(!r) return null; const s=JSON.parse(r); if(Date.now()-s.ts>3*60*60*1000){ pgClearSession(); return null; } return s; }catch(e){ return null; } }
function pgClearSession(){ try{ localStorage.removeItem(PG_SESSION_KEY); }catch(e){} }
function pgShowReconnect(){ const s=pgLoadSession(), b=g('btn-reconnect'); if(!b) return; if(!s||!s.roomCode){ b.style.display='none'; return; } b.style.display=''; b.textContent='🔄 前のルームに戻る（#'+s.roomCode+'）'; }
function pgSaveHostState(){
  if(!isHost || isSolo || !fbRoom || !fs) return;
  try{ fbPut('hostState', {ts:Date.now(), fsJson:JSON.stringify(fs), actTs:JSON.stringify(fbLastActTs||{})}); }catch(e){}
}
async function pgReconnect(){
  const s = pgLoadSession(); if(!s) return;
  myId=s.myId; myName=s.myName; roomCode=s.roomCode; fbRoom=s.fbRoom; isHost=s.isHost; isSolo=false;
  setSt('再接続中...');
  try{
    const meta = await fbGet('meta');
    if(!meta){ pgClearSession(); pgShowReconnect(); setErr('ルームが見つかりません（終了済みの可能性）'); setSt(''); fbRoom=''; return; }
    if(isHost){
      const hs = await fbGet('hostState');
      if(hs && hs.fsJson){
        fs = JSON.parse(hs.fsJson);
        if(fs.lock) fs.lock=false;
        fbListen();
        try{ fbLastActTs = JSON.parse(hs.actTs||'{}'); }catch(e){ fbLastActTs={}; }
        if(g('disp-code')) g('disp-code').textContent = roomCode;
        pgSaveSession(); sendHands();
        if(fs.phase==='exchange' && fs.exch){ const ep=P(fs.exch.pid); if(ep) sendExchange(ep); }
        bcast();
      } else { setErr('ルームの状態を復元できませんでした'); setSt(''); return; }
    } else {
      fbListen();
      fbSendToHost({type:'join', name:myName, id:myId});
      pgSaveSession();
      if(g('disp-code')) g('disp-code').textContent = roomCode;
      const bs=g('btn-start'); if(bs) bs.style.display='none';
      show('waiting');
    }
    setErr(''); setSt('');
  }catch(e){ setErr('再接続に失敗しました'); setSt(''); }
}
setTimeout(pgShowReconnect, 300);
window.addEventListener('pageshow', ()=>pgShowReconnect());

function openRules(){ if(typeof window.openRulesPga==='function') window.openRulesPga(); }
window.__coup = { CHARS, ACTIONS, CHAR_KEYS };
</script>

<script>
/* ================================================================
   PG共通アドオン v1
   ① 切断検知 ② 名前保存 ③ 古いルーム掃除 ④ 遊び方モーダル
   ================================================================ */
(function(){
'use strict';
var HB_MS=15000, WATCH_MS=10000, STALE_MS=40000;
var ROOM_TTL=24*60*60*1000, CLEAN_EVERY=6*60*60*1000;
var NAME_KEY='pgPlayerName';
function db(){
  try{ if(typeof fbUrl==='string' && fbUrl.indexOf('https://')===0) return fbUrl; }catch(e){}
  return 'https://playgame-3e7ba-default-rtdb.firebaseio.com';
}
function room(){ try{ return (typeof fbRoom==='string') ? fbRoom : ''; }catch(e){ return ''; } }
function me(){ var id='',nm='';
  try{ if(typeof myId==='string') id=myId; }catch(e){}
  try{ if(typeof myName==='string') nm=myName; }catch(e){}
  return {id:id, name:nm};
}
function put(url,body){ try{ return fetch(url,{method:'PUT',body:JSON.stringify(body),keepalive:true}); }catch(e){ return null; } }
function initName(){
  var saved='';
  try{ saved = localStorage.getItem(NAME_KEY) || localStorage.getItem('spName') || ''; }catch(e){}
  ['in-name','my-name'].forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    if(saved && !el.value) el.value=saved;
    function save(){ var v=(el.value||'').trim(); if(v){ try{ localStorage.setItem(NAME_KEY,v); }catch(e){} } }
    el.addEventListener('change',save); el.addEventListener('blur',save);
  });
}
var lastRoom='';
function syncRoom(){
  var r=room(), m=me();
  if(r!==lastRoom){
    if(lastRoom && m.id){ try{ fetch(db()+'/rooms/'+lastRoom+'/presence/'+m.id+'.json',{method:'DELETE',keepalive:true}); }catch(e){} }
    lastRoom=r;
  }
}
function beat(){ syncRoom(); var r=room(), m=me(); if(!r||!m.id) return; put(db()+'/rooms/'+r+'/presence/'+m.id+'.json',{t:Date.now(),n:m.name||'?'}); }
function markLeft(){ syncRoom(); var r=room(), m=me(); if(!r||!m.id) return; put(db()+'/rooms/'+r+'/presence/'+m.id+'.json',{t:Date.now(),n:m.name||'?',left:1}); }
var hideUntil=0;
function banner(txt){
  var b=document.getElementById('pga-banner');
  if(!txt || Date.now()<hideUntil){ if(b) b.style.display='none'; return; }
  if(!b){
    b=document.createElement('div'); b.id='pga-banner';
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99990;background:rgba(178,34,34,.93);color:#fff;font-size:12px;line-height:1.4;padding:5px 30px 5px 10px;text-align:center;font-family:sans-serif;';
    var t=document.createElement('span'); t.id='pga-banner-text'; b.appendChild(t);
    var x=document.createElement('span'); x.textContent='\u2715';
    x.style.cssText='position:absolute;right:8px;top:4px;cursor:pointer;padding:0 4px;';
    x.onclick=function(){ hideUntil=Date.now()+60000; b.style.display='none'; };
    b.appendChild(x); document.body.appendChild(b);
  }
  document.getElementById('pga-banner-text').textContent=txt;
  b.style.display='block';
}
function watch(){
  syncRoom();
  var r=room(), m=me();
  if(!r){ banner(''); return; }
  fetch(db()+'/rooms/'+r+'/presence.json').then(function(res){ return res.json(); }).then(function(d){
    if(room()!==r) return;
    if(!d){ banner(''); return; }
    var now=Date.now(), gone=[];
    Object.keys(d).forEach(function(pid){
      if(pid===m.id) return;
      var p=d[pid]||{};
      if(p.left || (p.t && now-p.t>STALE_MS)) gone.push(p.n||'?');
    });
    banner(gone.length ? ('\u26A0\uFE0F \u901A\u4FE1\u304C\u9014\u5207\u308C\u3066\u3044\u307E\u3059: '+gone.join('\u3001')) : '');
  }).catch(function(){});
}
setInterval(beat,HB_MS); setTimeout(beat,1500);
setInterval(watch,WATCH_MS); setTimeout(watch,4000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'){ beat(); watch(); } });
window.addEventListener('pagehide',markLeft);
function tsOf(k,sub){ return fetch(db()+'/rooms/'+k+'/'+sub+'.json').then(function(r){ return r.json(); }).catch(function(){ return null; }); }
async function cleanup(){
  try{
    var last=0; try{ last=+(localStorage.getItem('pgLastCleanup')||0); }catch(e){}
    if(Date.now()-last < CLEAN_EVERY) return;
    try{ localStorage.setItem('pgLastCleanup', String(Date.now())); }catch(e){}
    var res=await fetch(db()+'/rooms.json?shallow=true');
    var keys=await res.json(); if(!keys) return;
    var list=Object.keys(keys).filter(function(k){ return /^[A-Za-z0-9_]{1,6}-/.test(k) && k!==room(); });
    list.sort(function(){ return Math.random()-0.5; });
    var checked=0, deleted=0;
    for(var i=0;i<list.length;i++){
      if(checked>=80 || deleted>=25) break;
      var k=list[i]; checked++;
      var ts=0, v;
      v=await tsOf(k,'meta/ts');      if(typeof v==='number') ts=Math.max(ts,v);
      v=await tsOf(k,'broadcast/ts'); if(typeof v==='number') ts=Math.max(ts,v);
      v=await tsOf(k,'hostState/ts'); if(typeof v==='number') ts=Math.max(ts,v);
      v=await tsOf(k,'presence');
      if(v){ Object.keys(v).forEach(function(pid){ var t=v[pid]&&v[pid].t; if(typeof t==='number') ts=Math.max(ts,t); }); }
      if(!ts) continue;
      if(Date.now()-ts > ROOM_TTL){ try{ await fetch(db()+'/rooms/'+k+'.json',{method:'DELETE'}); deleted++; }catch(e){} }
    }
  }catch(e){}
}
setTimeout(cleanup,5000);
